<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Mantenimiento | Grupo Azor</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body { background-color: #f4f7fa; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }

        /* Oculta el contenedor principal por defecto */
        #app-container {
        display: none;
        }
        
        /* HEADER ESTILO PRO - CAMBIO DE COLOR */
        .app-header { 
            background-color: #005f9e; /* Azul Institucional */
            color: white; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .logo-section h1 { margin: 0; font-size: 1.4em; font-weight: 600; display: flex; align-items: center; gap: 10px; color: white; }
        /* Logo con filtro para que se vea blanco si es necesario */
        .logo-section i.fas { color: #ffc107; } /* Mantiene el color del escudo */

        
        /* BOTÓN DE NAVEGACIÓN PRO */
        .btn-header-nav { /* Estilo para el botón de navegación del header */
            background: #ffffff; color: #005f9e; border: 1px solid #ffffff; 
            padding: 8px 15px; border-radius: 6px; font-weight: 600; 
            cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .btn-header-nav:hover { background: #e0e0e0; color: #005f9e; border-color: #e0e0e0; }

        /* LAYOUT */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 30px; max-width: 1600px; margin: 0 auto; }
        @media(max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        /* PANELES */
        .panel { background: white; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); overflow: hidden; height: 80vh; display: flex; flex-direction: column; border: 1px solid #e9ecef; }
        .panel-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .panel-header h3 { margin: 0; font-size: 1.1em; color: #333; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .panel-body { padding: 20px; overflow-y: auto; flex: 1; background: #fafbfc; }

        /* TARJETAS DE TRABAJO (JOBS) */
        .job-card { background: #fff; border: 1px solid #e1e4e8; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #ffc107; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: all 0.2s; }
        .job-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .job-card.detenida { border-left-color: #dc3545; background-color: #fff5f5; }
        .job-meta { font-size: 0.85em; color: #6c757d; margin-top: 5px; }
        
        /* TARJETAS MECÁNICOS */
        .mec-card { background: #fff; border: 1px solid #e1e4e8; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .mec-avatar { width: 36px; height: 36px; background: #005f9e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9em; }
        .mec-info { margin-left: 12px; }
        .mec-name { font-weight: 700; color: #333; font-size: 0.95em; }
        .mec-area { font-size: 0.75em; color: #888; text-transform: uppercase; }
        
        /* STATUS DOTS */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75em; font-weight: bold; color: white; text-transform: uppercase; }
        .bg-green { background-color: #28a745; }
        .bg-red { background-color: #dc3545; }
        .bg-grey { background-color: #adb5bd; }

        /* BOTONES */
        .action-btn { background: white; border: 1px solid #ced4da; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; color: #333; transition: all 0.2s; }
        .action-btn:hover { background: #005f9e; color: white; border-color: #005f9e; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        
        /* LOGIN OVERLAY */
        #login-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,1); 
            z-index: 50; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }

        /* Modal Reasignación CSS */
        .filter-control { padding: 10px 15px; border: 1px solid #dee2e6; border-radius: 6px; background: #f8f9fa; color: #495057; font-size: 0.95em; transition: border-color 0.2s; }
    </style>
</head>
<body>
    <div id="app-container">
    <div id="reassign-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 450px; text-align: center;">
            <h3 style="color: #005f9e; margin-top:0;"><i class="fas fa-exchange-alt"></i> Reasignación de Folio</h3>
            <p id="reassign-job-info" style="color: #555; margin-bottom: 20px;">Cargando...</p>
            <div class="filter-group" style="margin-bottom: 20px;">
                <label for="new-mechanic-select" style="text-align: left; margin-bottom: 8px; font-weight: bold; display: block;">Seleccione el nuevo responsable:</label>
                <select id="new-mechanic-select" class="filter-control" style="width: 100%;">
                    </select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="btn-cancel-reassign" class="action-btn" style="background: #e9ecef;">Cancelar</button>
                <button id="btn-confirm-reassign" class="btn-primary">Confirmar Reasignación</button>
            </div>
        </div>
    </div>

    <header class="app-header">
        <div class="logo-section">
            <i class="fas fa-user-shield fa-lg" style="color: #ffc107;"></i>
            <h1>Panel Administrativo</h1>
        </div>
        <div>
            <button onclick="window.location.href='kpi_mantenimiento.html'" class="btn-header-nav" style="margin-right: 10px;">Ver Dashboard KPI</button>
        </div>
    </header>

    <main class="dashboard-grid">
        
        <div class="panel">
            <div class="panel-header">
                <h3><i class="fas fa-clipboard-list" style="color:#005f9e;"></i> Tickets en Curso</h3>
                <button onclick="loadDashboard()" class="action-btn" title="Actualizar"><i class="fas fa-sync"></i></button>
            </div>
            <div class="panel-body" id="active-jobs-list">
                <div style="text-align: center; margin-top: 50px; color: #999;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Cargando tickets...
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3><i class="fas fa-users-cog" style="color:#005f9e;"></i> Fuerza de Trabajo</h3>
                <span style="font-size: 0.75em; color: #28a745; font-weight: bold;">● En Línea</span>
            </div>
            <div class="panel-body" id="mechanics-list">
                <div style="text-align: center; margin-top: 50px; color: #999;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Cargando personal...
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script src="auth-security.js"></script>

 <script>
    // =======================================================
    // 1. DEFINICIÓN DE FUNCIONES PRINCIPALES (Fuera de DOMContentLoaded)
    // Estas funciones deben ser globales para que window.onload pueda llamarlas.
    // =======================================================

    async function loadDashboard() {
        try {
            const res = await fetch('/.netlify/functions/escribir-mantenimiento', {
                method: 'POST',
                body: JSON.stringify({ action: 'admin_get_dashboard' })
            });
            if(!res.ok) throw new Error("Error API");
            const data = await res.json();
            
            renderMechanics(data.mecanicos || []);
            renderJobs(data.jobs || []);
        } catch (e) { console.error(e); }
    }

    function renderMechanics(mecanicos) {
        // ... (Su función renderMechanics) ...
        const container = document.getElementById('mechanics-list');
        if(mecanicos.length === 0) { container.innerHTML = '<p style="text-align:center; color:#999;">No hay datos.</p>'; return; }
        
        let html = '';
        mecanicos.forEach(m => {
            let badgeClass = 'bg-grey';
            let statusText = 'Ausente';
            if(m.active === 'Disponible') {
                if(m.status === 'Libre') { badgeClass = 'bg-green'; statusText = 'Libre'; } 
                else { badgeClass = 'bg-red'; statusText = 'Ocupado'; }
            }
            
            html += `
            <div class="mec-card">
                <div style="display:flex; align-items:center;">
                    <div class="mec-avatar"><i class="fas fa-user"></i></div>
                    <div class="mec-info">
                        <div class="mec-name">${m.name}</div>
                        <div class="mec-area">${m.area}</div>
                    </div>
                </div>
                <span class="status-badge ${badgeClass}">${statusText}</span>
            </div>`;
        });
        container.innerHTML = html;
    }

    function renderJobs(jobs) {
        // ... (Su función renderJobs) ...
        const container = document.getElementById('active-jobs-list');
        if(jobs.length === 0) { container.innerHTML = `<div style="text-align:center; margin-top:50px; color:#28a745;"><i class="fas fa-check-circle fa-3x" style="opacity:0.5;"></i><p style="margin-top:15px;">¡Excelente! Sin incidencias activas.</p></div>`; return; }
        
        let html = '';
        jobs.forEach(j => {
            const isStopped = j.status === 'detenida';
            const icon = isStopped ? '<i class="fas fa-exclamation-triangle" style="color:#dc3545"></i>' : '<i class="fas fa-tools" style="color:#ffc107"></i>';
            const borderClass = isStopped ? 'detenida' : '';

            html += `
            <div class="job-card ${borderClass}">
                <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:10px;">
                    <div>
                        <div style="font-weight:700; font-size:1.05em; color:#333; display:flex; align-items:center; gap:8px;">
                            ${icon} ${j.maquina}
                        </div>
                        <div class="job-meta">${j.area} | Folio: ${j.folio}</div>
                    </div>
                    <span style="font-size:0.8em; background:#eee; padding:2px 6px; border-radius:4px;">${j.estado}</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px; border-radius:6px;">
                    <div style="font-size:0.9em; color:#555;">
                        Mecánico: <strong style="color:#333;">${j.mecanico}</strong>
                    </div>
                    <div>
                        <button onclick="promptReassign(${j.row}, '${j.mecanico}', '${j.folio}')" class="action-btn" style="margin-right: 5px;">
                            <i class="fas fa-exchange-alt"></i> Reasignar
                        </button>
                        <button onclick="closeManual(${j.row}, '${j.folio}')" class="action-btn" style="background: #dc3545; color: white; border-color: #dc3545;">
                            <i class="fas fa-times-circle"></i> Cerrar
                        </button>
                    </div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    // --- LÓGICA AUXILIAR DE BOTONES Y VENTANAS (Funciones globales requeridas por el HTML) ---
    // NOTA: Estas funciones deben estar definidas a nivel global (no dentro de DOMContentLoaded).

    // LÓGICA DE REASIGNACIÓN CON MODAL
    window.promptReassign = function(row, currentMec, folio) {
        const reassignModal = document.getElementById('reassign-modal');
        const newMecSelect = document.getElementById('new-mechanic-select');

        document.getElementById('reassign-job-info').innerHTML = 
            `<strong>Folio:</strong> ${folio} <br> <strong>Mecánico Actual:</strong> ${currentMec}`;
        
        // Guardamos las variables en el objeto global (window) o en el ámbito del script
        window.currentReassignRow = row;
        window.currentReassignMec = currentMec; 
        
        newMecSelect.value = ''; 
        reassignModal.style.display = 'flex';
    }

    // LÓGICA DE CIERRE MANUAL
    window.closeManual = async function(row, folio) {
        const adminName = 'Jefatura Mantenimiento';

        if (!adminName || adminName === 'Desconocido') {
            alert("Error de autenticación: No se pudo obtener el nombre del administrador de Auth0.");
            return;
        }
        
        const confirmation = confirm(`⚠️ ¿Confirmar el CIERRE MANUAL del Folio ${folio} (Fila ${row})?\n\nEsta acción es irreversible y marcará el ticket como "Cerrado Manual" a nombre de ${adminName}.`);
        
        if (confirmation) {
            try {
                const res = await fetch('/.netlify/functions/escribir-mantenimiento', {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'admin_cerrar_manual', 
                        row: row, 
                        name: adminName 
                    })
                });
                
                if (res.ok) {
                     alert(`✅ Folio ${folio} cerrado manualmente con éxito.`);
                     loadDashboard();
                } else {
                    const errorData = await res.json();
                    throw new Error(errorData.error || "Error desconocido en el servidor.");
                }
            } catch(e) { 
                alert(`❌ Error al cerrar el ticket: ${e.message}`); 
            }
        }
    }


    // =======================================================
    // 2. LÓGICA DE EVENTOS (Se ejecuta cuando el DOM está listo)
    // Aquí solo manejamos los listeners que dependen del DOM.
    // =======================================================
    document.addEventListener('DOMContentLoaded', () => {
     
        // Variables DOM y control de Reasignación
        const reassignModal = document.getElementById('reassign-modal');
        const newMecSelect = document.getElementById('new-mechanic-select');
        const btnConfirmReassign = document.getElementById('btn-confirm-reassign');
        const btnCancelReassign = document.getElementById('btn-cancel-reassign');
        
        // Llenar el selector de mecánicos del modal al inicio
        async function loadMechanicListForReassign() {
            try {
                const res = await fetch('/.netlify/functions/escribir-mantenimiento', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_mecanicos_activos' })
                });
                const data = await res.json();
                
                newMecSelect.innerHTML = '<option value="" disabled selected>-- Seleccione un Mecánico --</option>';
                (data.mecanicos || []).forEach(mec => {
                    newMecSelect.add(new Option(mec, mec));
                });
            } catch(e) {
                newMecSelect.innerHTML = '<option value="">Error al cargar</option>';
            }
        }
        loadMechanicListForReassign();

        // Listeners para el Modal
        btnCancelReassign.addEventListener('click', () => {
            reassignModal.style.display = 'none';
        });

        btnConfirmReassign.addEventListener('click', async () => {
            const newMec = newMecSelect.value;
            const currentReassignRow = window.currentReassignRow; // Obtenemos la variable
            const currentReassignMec = window.currentReassignMec; // Obtenemos la variable

            if (!newMec) {
                alert("Por favor seleccione un nuevo mecánico.");
                return;
            }
            
            if (currentReassignRow) {
                try {
                    await fetch('/.netlify/functions/escribir-mantenimiento', {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: 'admin_reassign', 
                            row: currentReassignRow, 
                            newMechanic: newMec,
                            oldMechanic: currentReassignMec
                        })
                    });
                    alert("✅ Mecánico reasignado correctamente. La tarea se ha actualizado en la app del mecánico.");
                    reassignModal.style.display = 'none';
                    loadDashboard();
                } catch(e) { 
                    alert("❌ Error al conectar con el servidor."); 
                }
            }
        });
    });

    // =======================================================
    // 3. INICIALIZACIÓN DE SEGURIDAD (Se ejecuta al final de la carga de la página)
    // =======================================================
    window.onload = async () => {
        // Ejecuta la seguridad: Autenticación obligatoria (true) y roles requeridos
        await initializeAuth(true, ['admin', 'super_man']); 
        document.getElementById('page-body').style.display = 'block';

        // Si initializeAuth pasa (no hubo redirección), cargamos el dashboard.
        loadDashboard(); 
        setInterval(loadDashboard, 10000);
    };
 </script>

    
</body>
</html>
