# 1. Permite el acceso al favicon sin restricciones
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

# 2. Permite el acceso directo a la página de login
[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200

# 3. Permite el acceso a la página de logout (Debe estar antes del /*)
[[redirects]]
  from = "/logged-out"
  to = "/login.html"
  status = 200

# 🛑 4. RUTA CRUCIAL: Intercepta cualquier ruta que contenga el parámetro 'code'
# Esto fuerza a Netlify a ejecutar la función Lambda cuando Auth0 nos devuelve el código.
[[redirects]]
  from = "/*" # Aplica a cualquier ruta (incluyendo la raíz '/')
  to = "/.netlify/functions/auth-callback" # Redirige a la función Lambda
  status = 200
  force = true
  query = {code = ":code"} # Solo se activa si la URL tiene ?code=...

# 5. REGLA DE PROTECCIÓN: Bloquea todas las demás rutas
[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 401
  force = true
  signed = "auth0"
  conditions = {Role = ["member"]}