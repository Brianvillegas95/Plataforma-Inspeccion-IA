# =================================================================
# CONFIGURACIÓN NETLIFY: REDIRECCIONES Y CONTROL DE ACCESO (TOML FORMAT)
# =================================================================

# 0. REGLAS CRUCIALES: PERMITIR CARGAR ARCHIVOS ESTÁTICOS Y EL WIDGET
# Estos archivos deben ser accesibles para que la página de login pueda mostrarse.
[[redirects]]
  from = "/.netlify/identity/*"
  to = "/.netlify/identity/:splat"
  status = 200
  force = true 

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/imagenes/*"
  to = "/imagenes/:splat"
  status = 200

[[redirects]]
  from = "/Archivos/*"
  to = "/Archivos/:splat"
  status = 200

# 1. ACCESO RESTRINGIDO MÁXIMO (Solo Jefes de Mantenimiento)
[[redirects]]
  from = "/admin-mantenimiento.html"
  to = "/admin-mantenimiento.html"
  status = 200
  conditions = {Role = ["mantenimiento_jefe"]}

# 2. ACCESO A DATOS SENSIBLES (Supervisores/Admin)
[[redirects]]
  from = "/dashboard-ajustes.html"
  to = "/dashboard-ajustes.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/kpi_mantenimiento.html"
  to = "/kpi_mantenimiento.html"
  status = 200
  conditions = {Role = ["admin"]}

# 3. REGLA DE BLOQUEO GENERAL (Protege todo lo demás)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["usuario"]}

# 4. REGLA FINAL: MANEJO DE ERRORES 404 (Muestra la interfaz de login)
# Esto garantiza que, si alguna regla de rol falla (resultando en 404),
# la página de inicio (con el widget de login) se muestre correctamente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
