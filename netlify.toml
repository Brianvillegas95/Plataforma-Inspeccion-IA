# =================================================================
# CONFIGURACIÓN NETLIFY: REDIRECCIONES Y CONTROL DE ACCESO (TOML FORMAT)
# =================================================================

# 0. REGLAS CRUCIALES: PERMITIR CARGAR ARCHIVOS ESTÁTICOS Y EL WIDGET
# Estos archivos deben ser accesibles para que la página de login pueda mostrarse.
[[redirects]]
  from = "/.netlify/identity/*"
  to = "/.netlify/identity/:splat"
  status = 200
  force = true # Obliga a que esta regla se aplique siempre

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200
  # No se requiere condición de rol: cualquiera puede cargar el CSS

[[redirects]]
  from = "/imagenes/*"
  to = "/imagenes/:splat"
  status = 200

[[redirects]]
  from = "/Archivos/*"
  to = "/Archivos/:splat"
  status = 200

# 1. ACCESO RESTRINGIDO MÁXIMO (Solo Jefes de Mantenimiento)
[[redirects]]
  from = "/admin_mantenimiento.html"
  to = "/admin_mantenimiento.html"
  status = 200
  conditions = {Role = ["mantenimiento_jefe"]}

# 2. ACCESO A DATOS SENSIBLES (Supervisores/Admin)
[[redirects]]
  from = "/dashboard-ajustes.html"
  to = "/dashboard-ajustes.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/kpi_mantenimiento.html"
  to = "/kpi_mantenimiento.html"
  status = 200
  conditions = {Role = ["admin"]}

# 3. REGLA FINAL: PROTECCIÓN GENERAL DEL SITIO
# Aplicamos la restricción de rol a la página principal y a CUALQUIER otra página HTML.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["usuario"]}
