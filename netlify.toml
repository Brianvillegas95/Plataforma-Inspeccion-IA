# =================================================================
# CÓDIGO FINAL Y FUNCIONAL PARA BLOQUEO POR ROL
# =================================================================

# 0. REGLAS CRUCIALES: PERMITIR CARGAR ARCHIVOS ESTÁTICOS Y EL WIDGET
[[redirects]]
  from = "/.netlify/identity/*"
  to = "/.netlify/identity/:splat"
  status = 200
  force = true 

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/imagenes/*"
  to = "/imagenes/:splat"
  status = 200

[[redirects]]
  from = "/Archivos/*"
  to = "/Archivos/:splat"
  status = 200


# 1. ACCESO RESTRINGIDO MÁXIMO (Jefes de Mantenimiento)
[[redirects]]
  from = "/admin-mantenimiento.html"
  to = "/admin-mantenimiento.html"
  status = 200
  conditions = {Role = ["mantenimiento_jefe"]}


# 2. ACCESO A DATOS SENSIBLES (Supervisores/Admin)
[[redirects]]
  from = "/dashboard-ajustes.html"
  to = "/dashboard-ajustes.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/kpi_mantenimiento.html"
  to = "/kpi_mantenimiento.html"
  status = 200
  conditions = {Role = ["admin"]}


# 3. REGLA DE BLOQUEO GENERAL (Protege todo lo demás)
# Esta regla usa el código 302 (Found) para forzar la redirección
# al login si el rol falla. Es la forma más efectiva de activar
# la pantalla de autenticación de Netlify Identity.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 302 # Usamos 302 para forzar una redirección de login
  conditions = {Role = ["usuario"]}
