<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciando Sesión...</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>🔒 Redireccionando a Inicio de Sesión...</h1>
    <p>Si no es redirigido automáticamente, haga clic en el botón de abajo.</p>
    <button id="login-btn" style="padding: 10px 20px; font-size: 16px;">Iniciar Sesión</button>

    <script>
        // ⚠️ USAMOS LA URL CON LA REGIÓN (US) Y SIN REGIÓN COMO RESPALDO
        const auth0_domain_us = 'dev-8nfvmq7g3rifqdu4.us.auth0.com'; 
        const auth0_client_id = 't15UKfkVM0DacmpDIm0OsLSne9X5KoRH'; 
        const auth0_callback_url = window.location.origin; // https://azor-calidad.netlify.app

        // URL DE LA AUDIENCE (API) REQUERIDA POR AUTH0 PARA EL FLUJO RBAC/TOKEN
        // Usamos la URL de la Management API que Auth0 crea por defecto
        const auth0_audience = `https://${auth0_domain_us}/api/v2/`;
        
        // --- Construir la URL de autenticación manualmente (CORRECCIÓN CLAVE) ---
        
        const authUrl = `https://${auth0_domain_us}/authorize?` +
                        `response_type=token%20id_token&` +
                        `client_id=${auth0_client_id}&` +
                        `audience=${encodeURIComponent(auth0_audience)}&` + // 🔑 AÑADIDO ESTE PARÁMETRO
                        `redirect_uri=${encodeURIComponent(auth0_callback_url)}&` +
                        `scope=openid%20profile%20email`;

        function login() {
            // Usamos window.location.replace para la redirección
            window.location.replace(authUrl);
        }

        // Iniciar el login automáticamente
        window.onload = login;

        // Conectar la función al botón
        document.getElementById('login-btn').addEventListener('click', login);
    </script>
</body>
</html>
