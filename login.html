<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciando Sesión...</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>🔒 Redireccionando a Inicio de Sesión...</h1>
    <p>Si no es redirigido automáticamente, haga clic en el botón de abajo.</p>
    <button id="login-btn" style="padding: 10px 20px; font-size: 16px;">Iniciar Sesión</button>

    <script>
        // 🛑 TUS CREDENCIALES
        const auth0_domain = 'dev-8nfvmq7g3rifqdu4.us.auth0.com'; 
        const auth0_client_id = 't15UKfkVM0DacmpDIm0OsLSne9X5KoRH'; 
        
        // 🔑 CORRECCIÓN FINAL: Usamos la RUTA ÚNICA que creamos en Netlify
        const auth0_callback_url = 'https://azor-calidad.netlify.app/auth-callback'; 
        
        // AUDIENCE: Usamos el dominio fijo para que Auth0 lo acepte
        const auth0_audience = `https://${auth0_domain}/api/v2/`; 

        // --- CONSTRUCCIÓN DE LA URL DE AUTORIZACIÓN (FLUJO CODE) ---
        const authUrl = `https://${auth0_domain}/authorize?` +
                        `response_type=code&` + 
                        `client_id=${auth0_client_id}&` +
                        `audience=${encodeURIComponent(auth0_audience)}&` + 
                        `redirect_uri=${encodeURIComponent(auth0_callback_url)}&` + // Usa la nueva ruta
                        `scope=openid%20email`; 

        function login() {
            window.location.replace(authUrl);
        }

        // Iniciar el login automáticamente (descomenta si quieres que sea instantáneo)
        // window.onload = login;

        // Conectar la función al botón
        document.getElementById('login-btn').addEventListener('click', login);
    </script>
</body>
</html>
