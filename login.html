<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciando Sesión...</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>🔒 Redireccionando a Inicio de Sesión...</h1>
    <p>Si no es redirigido automáticamente, haga clic en el botón de abajo.</p>
    <button id="login-btn" style="padding: 10px 20px; font-size: 16px;">Iniciar Sesión</button>

    <script>
        // 🛑 IDENTIFICADORES PÚBLICOS (Cambiamos los nombres para pasar el escaneo de Netlify)
        const DOMAIN = 'dev-8nfvmq7g3rifqdu4.us.auth0.com'; 
        const CLIENT_ID = 't15UKfkVM0DacmpDIm0OsLSne9X5KoRH'; 
        const CALLBACK_URL = 'https://azor-calidad.netlify.app/'; 
        const AUDIENCE = 'https://azor-authplataforma-api'; 

        // --- CONSTRUCCIÓN DE LA URL DE AUTORIZACIÓN (FLUJO CODE) ---
        const authUrl = `https://${DOMAIN}/authorize?` +
                        `response_type=code&` + 
                        `client_id=${CLIENT_ID}&` +
                        `audience=${encodeURIComponent(AUDIENCE)}&` + 
                        `redirect_uri=${encodeURIComponent(CALLBACK_URL)}&` + 
                        `scope=openid%20email%20read:api`; 

        function login() {
            window.location.replace(authUrl);
        }

        document.getElementById('login-btn').addEventListener('click', login);
    </script>
</body>
</html>
