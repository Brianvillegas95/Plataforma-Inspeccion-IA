<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Mecánico - Grupo Azor</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        body { 
            background-color: #f4f7f6; 
            /* Usar 'var' de tu estilos.css si está definido, si no, un color por defecto */
            background-color: var(--light-bg, #f4f7f6);
        }
        .app-container { 
            max-width: 800px; 
            margin: 0 auto; 
            min-height: 100vh;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--dark-bg, #222); /* Color de tu header principal */
        }
        .app-header h1 { 
            color: var(--text-primary, #fff); 
            margin: 0; 
            font-size: 1.5em; 
        }
        .main-content { 
            padding: 20px; 
        }
        
        /* Contenedor del Login */
        #login-container { 
            text-align: center; 
            padding: 40px 20px; 
        }
        #login-container h2 { 
            margin-bottom: 20px; 
        }
        #netlify-identity-widget { 
            display: inline-block; 
        }

        /* Contenedor de la App (Oculto) */
        #app-wrapper { 
            display: none; /* Se muestra con JS */
        }
        
        .task-section {
            background-color: var(--surface-bg, #ffffff);
            border-radius: var(--border-radius, 8px);
            margin-bottom: 25px;
            box-shadow: var(--shadow-md, 0 4px 6px rgba(0,0,0,0.1));
            overflow: hidden;
        }
        .task-header {
            background-color: var(--azor-blue, #005f9e);
            color: var(--text-primary, #ffffff);
            padding: 15px 20px;
        }
        .task-header.secondary { 
            background-color: var(--medium-bg, #e0e0e0); 
            color: var(--text-main, #333); 
        }
        .task-header h2 { 
            margin: 0; 
            font-size: 1.25em;
        }
        
        .task-content { 
            padding: 20px; 
        }
        .task-content p { 
            font-size: 1.1em; 
            line-height: 1.6; 
            margin: 0.5em 0;
            color: var(--text-secondary, #555);
        }
        .task-content strong { 
            color: var(--text-main, #222); 
            font-weight: 600;
        }
        
        .no-task {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2em;
            color: var(--text-secondary, #777);
            font-style: italic;
        }
        .loading-spinner { 
            display: none; 
            width: 40px; 
            height: 40px; 
            border: 4px solid var(--light-bg, #f4f7f6); 
            border-top: 4px solid var(--azor-blue, #005f9e); 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Botón de Logout (estilos de Netlify) */
        .netlify-identity-button {
            background-color: var(--azor-blue, #005f9e);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .netlify-identity-button:hover {
            background-color: #004a7c;
        }
    </style>
</head>
<body class="color-validator-body">

    <div id="app-wrapper">
        <header class="app-header">
            <h1>Mis Tareas</h1>
            <div data-netlify-identity-button></div>
        </header>

        <main class="main-content">
            <div id="loading-spinner-app" class="loading-spinner" style="display: block;"></div>
            
            <section id="tarea-actual-section" class="task-section" style="display: none;">
                <div class="task-header">
                    <h2><i class="fas fa-wrench"></i> Tarea Actual</h2>
                </div>
                <div class="task-content" id="tarea-actual-content">
                    </div>
            </section>
            
            <section id="cola-section" class="task-section" style="display: none;">
                <div class="task-header secondary">
                    <h2><i class="fas fa-list-ol"></i> Tareas en Cola</h2>
                </div>
                <div class="task-content" id="cola-content">
                    </div>
            </section>
        </main>
    </div>

    <div id="login-container">
        <h2>App de Mecánicos</h2>
        <p>Inicia sesión para ver tus tareas.</p>
        <div data-netlify-identity-button></div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginContainer = document.getElementById('login-container');
        // CAMBIO: Apuntar al ID correcto 'app-wrapper'
        const appWrapper = document.getElementById('app-wrapper');
        const loadingSpinner = document.getElementById('loading-spinner-app');
        const tareaActualSection = document.getElementById('tarea-actual-section');
        const tareaActualContent = document.getElementById('tarea-actual-content');
        const colaSection = document.getElementById('cola-section');
        const colaContent = document.getElementById('cola-content');
        
        let taskCheckInterval = null;
        let currentUserName = null;

        // --- API Calls ---
        
        async function callApi(action, name) {
            try {
                const response = await fetch('/.netlify/functions/escribir-mantenimiento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, name })
                });
                if (!response.ok) throw new Error(`Error en ${action}`);
                return await response.json();
            } catch (error) {
                console.error(`Error en ${action}:`, error);
            }
        }
        
        async function getMisTareas() {
            if (!currentUserName) return;
            
            console.log("Revisando tareas...");
            // Usamos la acción corregida
            const data = await callApi('get_mecanico_tareas', currentUserName);
            
            if (!data) return; 
            
            loadingSpinner.style.display = 'none';

            // Renderizar Tarea Actual
            if (data.tareaActual) {
                const tarea = data.tareaActual;
                tareaActualContent.innerHTML = `
                    <p><strong>Folio:</strong> ${tarea.folio}</p>
                    <p><strong>Area:</strong> ${tarea.area}</p>
                    <p><strong>Máquina:</strong> ${tarea.maquina}</p>
                    <p><strong>Estación:</strong> ${tarea.estacion}</p>
                    <p><strong>Estado:</strong> <strong style="color: ${tarea.statusParo === 'En Proceso' ? 'var(--success-color, green)' : 'var(--azor-blue, #005f9e)'};">${tarea.statusParo}</strong></p>
                `;
                tareaActualSection.style.display = 'block';
            } else {
                tareaActualSection.style.display = 'block';
                tareaActualContent.innerHTML = `<p class="no-task">No tienes una tarea activa.</p>`;
            }

            // Renderizar Tarea en Cola
            if (data.tareasEnCola && data.tareasEnCola.length > 0) {
                let colaHtml = '';
                data.tareasEnCola.forEach((tarea, index) => {
                    colaHtml += `
                        <div style="border-bottom: 1px solid var(--light-bg, #eee); padding-bottom: 15px; margin-bottom: 15px;">
                            <p><strong>${index + 1}. Folio:</strong> ${tarea.folio}</p>
                            <p><strong>Area:</strong> ${tarea.area}</p>
                            <p><strong>Máquina:</strong> ${tarea.maquina}</p>
                        </div>
                    `;
                });
                colaContent.innerHTML = colaHtml;
                colaSection.style.display = 'block';
            } else {
                colaSection.style.display = 'block';
                colaContent.innerHTML = `<p class="no-task">No hay tareas en cola.</p>`;
            }
        }

        // --- Lógica de Autenticación (Corregida) ---

        function showApp(user) {
            loginContainer.style.display = 'none';
            appWrapper.style.display = 'block'; // Mostrar app
            
            currentUserName = user.user_metadata.full_name;
            console.log(`Usuario logueado: ${currentUserName}`);
            
            if (!currentUserName) {
                alert("Error: No se encontró el nombre completo del usuario. Contacta al administrador.");
                return;
            }
            
            callApi('mecanico_check_in', currentUserName);
            
            loadingSpinner.style.display = 'block';
            getMisTareas();
            
            stopTaskCheck();
            taskCheckInterval = setInterval(getMisTareas, 15000); 
        }

        function showLogin() {
            appWrapper.style.display = 'none'; // Ocultar app
            loginContainer.style.display = 'block';
            
            stopTaskCheck();
            
            if (currentUserName) {
                console.log(`Usuario cerrando sesión: ${currentUserName}`);
                callApi('mecanico_check_out', currentUserName);
                currentUserName = null;
            }
        }

        function stopTaskCheck() {
            if (taskCheckInterval) {
                clearInterval(taskCheckInterval);
                taskCheckInterval = null;
            }
        }

        // Eventos de Netlify Identity
        netlifyIdentity.on('login', (user) => {
            console.log('Evento de login detectado.');
            showApp(user);
        });

        netlifyIdentity.on('logout', () => {
            console.log('Evento de logout detectado.');
            showLogin();
        });

        // Inicialización
        netlifyIdentity.on('init', (user) => {
            console.log('Netlify Identity iniciado.');
            if (user) {
                showApp(user);
            } else {
                showLogin();
            }
        });
        
        // Inicializa el widget
        netlifyIdentity.init();
    });
    </script>
</body>
</html>
