<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Supervisor - Solicitud de Tarimas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Estilos específicos que usan las clases del CSS base */
        .container { 
            max-width: 1300px; 
            margin: 30px auto; 
            background: var(--surface-bg); 
            padding: 30px; 
            border-radius: var(--border-radius); 
            box-shadow: var(--shadow-lg); 
            border: 1px solid var(--border-color);
        }
        h2 { 
            color: var(--azor-blue); 
            text-align: center; 
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        h3 {
            color: var(--text-primary);
            margin-top: 30px;
            font-size: 1.2em;
        }

        /* Formulario de búsqueda (se mantiene) */
        #search-form { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
            align-items: stretch;
        }
        #search-form input, #search-form select { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--border-radius); 
            font-size: 1em;
            box-sizing: border-box; 
        }
        #search-form button { 
            flex-basis: 150px; 
            background-color: var(--primary-action, var(--azor-blue)); 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: var(--border-radius); 
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #search-form button:hover:not(:disabled) { 
            background-color: var(--azor-blue-dark); 
        }

        /* Resultados (se mantienen) */
        .result-item { 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: var(--border-radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f9f9f9;
            box-shadow: var(--shadow-sm); 
        }
        .result-item button { 
            background-color: var(--danger-color); 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background-color 0.3s; 
            font-weight: bold;
        }


        /* Estructura del Rack Virtual UNIFORME */
        #rack-wrapper { 
            /* Grid principal: define el número de carriles y niveles */
            display: grid; 
            /* Crea 18 columnas de tamaño igual y compacto */
            grid-template-columns: repeat(18, minmax(65px, 1fr)); 
            /* Define 10 filas explícitas para simular los 10 niveles del rack */
            grid-template-rows: repeat(10, minmax(40px, 1fr)); 
            gap: 2px; /* Espacio mínimo entre huecos */
            margin-top: 25px; 
            padding: 10px 5px; 
            background: #e9ecef; 
            border-radius: var(--border-radius); 
            overflow-x: auto; /* Permite scroll horizontal si se necesitan más de 18 */
            overflow-y: hidden; /* Oculta scroll vertical innecesario */
            height: 500px; /* Altura fija para la estética */
        }

        .carril-title {
            /* Encabezado de la columna (letra del carril) */
            background-color: var(--azor-blue-dark);
            color: white;
            padding: 5px 0;
            font-weight: 700;
            text-align: center;
            font-size: 0.85em;
            letter-spacing: 1px;
            /* Se coloca en la primera fila (row 1) */
            grid-row: 1; 
            align-self: start; 
        }

        .hueco-nivel { 
            /* Estilo del bloque individual de hueco */
            padding: 4px 2px; /* Aún más compacto */
            font-size: 0.6em; /* Fuente más pequeña para mostrar más texto */
            line-height: 1.1;
            text-align: center;
            font-weight: 600;
            cursor: default;
            transition: transform 0.1s;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .hueco-nivel:hover {
            transform: scale(1.03);
            z-index: 10;
        }
        
        /* Clases de estado */
        .disponible { 
            background-color: #d4edda; 
            color: var(--success-color); 
        }
        .ocupado { 
            background-color: #fff3cd; 
            color: var(--warning-color); 
        }
        .propia { 
            background-color: var(--azor-blue); 
            color: white; 
            font-weight: 700;
        }
        .libre {
            color: var(--text-secondary);
            font-weight: 500;
            font-style: italic;
        }
        /* El texto secundario ahora es la OP y Tarima */
        .hueco-text-secondary {
            font-size: 1em; /* Mismo tamaño que el principal */
            font-weight: normal;
        }

        /* Elementos de carga */
        .loading-spinner {
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--azor-blue); 
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 5px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { background-color: #f8d7da; color: var(--danger-color); border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: var(--success-color); border: 1px solid #c3e6cb; }

    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-search"></i> Consulta y Solicitud de Tarimas</h2>
        
        <form id="search-form">
            <input type="text" id="search-op-input" required maxlength="7" pattern="\d{7}" placeholder="Ingrese OP de 7 dígitos">
            <select id="search-area-select" required>
                <option value="" disabled selected>-- Seleccione su Área --</option>
                <option value="Empaque">Empaque</option>
                <option value="Ensamble">Ensamble</option>
                <option value="Kinera">Kinera</option>
                <option value="Moldeo">Moldeo</option>
                <option value="Boligrafo">Bolígrafo</option>
            </select>
            <button type="submit" id="search-btn"><i class="fas fa-search"></i> Buscar Tarimas</button>
        </form>
        
        <div id="message-supervisor" style="margin-top: 20px;"></div>
        
        <h3>Tarimas Encontradas:</h3>
        <div id="search-results">
            <p>Ingrese una OP y un Área para buscar.</p>
        </div>

        <h3>Rack Virtual (Visualización de Carriles y Niveles):</h3>
        <div id="rack-wrapper">
            <p style="grid-column: 1 / -1;"><span class="loading-spinner"></span> Cargando estado del Pulmón...</p>
        </div>
    </div>
    
    <script>
        const API_URL = '/.netlify/functions/gestion-pulmon';
        const searchForm = document.getElementById('search-form');
        const searchResultsDiv = document.getElementById('search-results');
        const messageDiv = document.getElementById('message-supervisor');
        const rackWrapperDiv = document.getElementById('rack-wrapper');
        const searchBtn = document.getElementById('search-btn');

        let tarimasEncontradas = []; 

        function showMessage(text, isError = false) {
            messageDiv.innerHTML = `<div style="padding: 10px; border-radius: 5px; text-align: center;" class="${isError ? 'error' : 'success'}">${text}</div>`;
        }
        
        // Función auxiliar para obtener la columna (letra) por índice
        function getColumnIndex(carrilKey) {
            return carrilKey.charCodeAt(0) - 'A'.charCodeAt(0) + 1;
        }

        function renderRack(inventario, opEncontrada = null) {
            rackWrapperDiv.innerHTML = '';
            
            if (!inventario || inventario.length === 0) {
                rackWrapperDiv.innerHTML = `<p style="grid-column: 1 / -1;">No se pudo cargar el inventario o está vacío.</p>`;
                return;
            }

            // 1. Agrupar por Carril (letra inicial) y Nivel (número)
            const carriles = inventario.reduce((acc, h) => {
                const id = h.ID_Hueco || 'Z'; 
                const carril = id.charAt(0);
                const nivelNum = parseInt(id.substring(1, 3), 10); 

                if (!acc[carril]) {
                    acc[carril] = [];
                }
                acc[carril].push({
                    ...h,
                    nivel: nivelNum 
                });
                return acc;
            }, {});

            // 2. Ordenar las letras de los carriles (A, B, C...)
            const carrilesOrdenados = Object.keys(carriles).sort();
            
            // 3. Crear los encabezados de carril (columna 1)
            carrilesOrdenados.forEach(carrilKey => {
                if (carrilKey === 'Z') return;
                
                const col = getColumnIndex(carrilKey);
                
                // Añadir el encabezado (Letra)
                const titleDiv = document.createElement('div');
                titleDiv.className = 'carril-title';
                titleDiv.style.gridColumn = col;
                titleDiv.innerHTML = carrilKey;
                rackWrapperDiv.appendChild(titleDiv);

                const carrilData = carriles[carrilKey];
                
                // Ordenar los huecos DENTRO del carril por Nivel ascendente (1, 2, 3...)
                carrilData.sort((a, b) => a.nivel - b.nivel); 

                // Añadir los huecos (comienzan en la fila 2 para dejar espacio al título)
                carrilData.forEach(h => {
                    let clase = h.Estatus_Hueco === 'DISPONIBLE' ? 'disponible' : 'ocupado';
                    let textoPrincipal = h.ID_Hueco; // Nombre completo (A01CH)
                    let textoSecundario;
                    
                    if (h.Estatus_Hueco !== 'DISPONIBLE') {
                        // Muestra la OP y el N° de Tarima
                        textoSecundario = `<span class="hueco-text-secondary">${h.OP_Tarima}</span><br><span class="hueco-text-secondary">(${h.Tarima_Num})</span>`;
                        if (h.OP_Tarima === opEncontrada) {
                            clase = 'propia';
                        }
                    } else {
                        textoSecundario = `<span class="libre">LIBRE</span>`;
                    }

                    const huecoDiv = document.createElement('div');
                    huecoDiv.className = `hueco-nivel ${clase}`;
                    huecoDiv.style.gridColumn = col;
                    // Se posiciona el hueco según su nivel (Nivel 1 está en la fila 10, Nivel 10 está en la fila 1)
                    // Usamos 11 - nivel, asumiendo 10 niveles y que la fila 1 es el título.
                    huecoDiv.style.gridRow = 11 - h.nivel; 
                    huecoDiv.innerHTML = `${textoPrincipal}<br>${textoSecundario}`;
                    rackWrapperDiv.appendChild(huecoDiv);
                });
            });
        }

        async function cargarInventarioCompleto(op = null) {
            rackWrapperDiv.innerHTML = `<p style="grid-column: 1 / -1;"><span class="loading-spinner"></span> Cargando estado del Pulmón...</p>`;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_inventario' }),
                });
                if (!response.ok) throw new Error('Error al cargar inventario completo.');
                const data = await response.json();
                renderRack(data.inventario, op);
            } catch (error) {
                rackWrapperDiv.innerHTML = `<p style="grid-column: 1 / -1; color: var(--danger-color);">Error cargando rack: ${error.message}</p>`;
            }
        }

        async function buscarOP(op, area) {
            searchBtn.disabled = true;
            searchResultsDiv.innerHTML = '<p><span class="loading-spinner"></span> Buscando...</p>';
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consultar_op', opBusqueda: op, areaBusqueda: area }),
                });
                
                const result = await response.json();

                if (response.status === 404) {
                    searchResultsDiv.innerHTML = `<p style="color: var(--text-secondary);">${result.message}</p>`;
                    tarimasEncontradas = [];
                } else if (!response.ok) {
                    throw new Error(result.error || 'Error al buscar.');
                } else {
                    tarimasEncontradas = result.resultados;
                    renderResults(op, area);
                }
                
                await cargarInventarioCompleto(op); 
                
            } catch (error) {
                showMessage(`Error en la búsqueda: ${error.message}`, true);
                searchResultsDiv.innerHTML = `<p style="color: var(--danger-color);">Error al consultar: ${error.message}</p>`;
                tarimasEncontradas = [];
            } finally {
                searchBtn.disabled = false;
            }
        }

        function renderResults(op, area) {
            if (tarimasEncontradas.length === 0) {
                searchResultsDiv.innerHTML = `<p style="color: var(--text-secondary);">No se encontraron tarimas activas para OP ${op}.</p>`;
                return;
            }

            let html = `
                <div style="background: #e6f7ff; padding: 10px; border: 1px solid #91d5ff; border-radius: 4px; margin-bottom: 15px; font-weight: bold;">
                    <p style="margin: 0;">Se encontraron **${tarimasEncontradas.length}** tarimas para la OP **${op}** (${area}).</p>
                </div>
            `;

            tarimasEncontradas.forEach((tarima, index) => {
                html += `
                    <div class="result-item">
                        <div>
                            <h3><i class="fas fa-pallet"></i> Tarima ${tarima.tarimaNum}</h3>
                            <p style="margin: 0;"><strong>Hueco:</strong> ${tarima.idHueco}</p>
                            <p style="margin: 0; font-size: 0.9em; color: var(--text-secondary);">Registrada: ${tarima.fechaEntrada}</p>
                        </div>
                        <button onclick="solicitarRetiro(${index}, this)">
                            <i class="fas fa-times-circle"></i> Solicitar Retiro
                        </button>
                    </div>
                `;
            });

            searchResultsDiv.innerHTML = html;
        }

        window.solicitarRetiro = async function(index, buttonElement) {
            const tarima = tarimasEncontradas[index];
            const op = document.getElementById('search-op-input').value.trim();
            const area = document.getElementById('search-area-select').value;
            
            if (!confirm(`¿Está seguro de solicitar el retiro de la Tarima ${tarima.tarimaNum} del hueco ${tarima.idHueco}?`)) {
                return;
            }

            buttonElement.disabled = true;
            buttonElement.innerHTML = '<span class="loading-spinner"></span> Procesando...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'solicitar_retiro',
                        row: tarima.row, 
                        op: op, 
                        hueco: tarima.idHueco,
                        tarimaNumStr: tarima.tarimaNum,
                        area: area
                    }),
                });
                
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Error al solicitar retiro.');
                }

                showMessage(`¡Éxito! ${result.message}`, false);
                
                // Remover la tarima liberada y actualizar la vista
                tarimasEncontradas.splice(index, 1);
                renderResults(op, area);
                await cargarInventarioCompleto(op); 

            } catch (error) {
                showMessage(`Error al liberar hueco: ${error.message}`, true);
            } finally {
                buttonElement.disabled = false;
                buttonElement.innerHTML = '<i class="fas fa-times-circle"></i> Solicitar Retiro';
            }
        };


        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const op = document.getElementById('search-op-input').value.trim();
            const area = document.getElementById('search-area-select').value;
            if (op.length !== 7 || isNaN(op)) {
                showMessage('La OP debe ser un número de 7 dígitos.', true);
                return;
            }
            if (!area) {
                showMessage('Debe seleccionar su Área.', true);
                return;
            }
            buscarOP(op, area);
        });

        document.addEventListener('DOMContentLoaded', () => cargarInventarioCompleto());
    </script>
</body>
</html>
