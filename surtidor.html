<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Surtidor - Pulmón | Grupo Azor</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* HEADER COPIADO DE KPI */
        .app-header { 
            background-color: #005f9e; 
            border-bottom: 1px solid #004a7c; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            color: white;
        }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo { height: 45px; width: auto; filter: brightness(0) invert(1); } /* Logo blanco */
        .app-title { font-size: 1.4em; font-weight: 700; color: #ffffff; margin: 0; }

        /* CONTENIDO */
        .container { 
            max-width: 600px; 
            margin: 40px auto; 
            background: var(--surface-bg, #fff); 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border: 1px solid #dee2e6;
        }
        h2 { color: #005f9e; text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .button.primary-action-green { 
            background-color: #28a745; border-color: #28a745; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; padding: 15px 20px;
            font-size: 1.1em; font-weight: bold; border-radius: 6px; cursor: pointer; border:none;
        }
        .button.primary-action-green:hover { background-color: #218838; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }

        .panel-card { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #ddd; border-left: 5px solid #005f9e; margin-bottom: 10px; }
        
        #message { margin-top: 25px; padding: 15px; border-radius: 6px; text-align: center; display: none; font-weight: bold; }
        .error { background-color: #f8d7da; color: #dc3545; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #28a745; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <img src="imagenes/Logo azor.png" alt="Grupo Azor" class="logo">
            <h1 class="app-title">Surtidor Pulmón</h1>
        </div>
    </header>

    <div class="container">
        <h2><i class="fas fa-pallet"></i> Registro de Entrada</h2>
        <form id="registro-form">
            <div class="form-group">
                <label>Orden de Producción (OP) (7 dígitos):</label>
                <input type="text" id="op-input" required maxlength="7" pattern="\d{7}" placeholder="Ej: 1234567">
            </div>
            <div class="form-group">
                <label>Área de Destino:</label>
                <select id="area-select" required>
                    <option value="" disabled selected>-- Seleccione el área --</option>
                    <option value="Empaque">Empaque</option>
                    <option value="Ensamble">Ensamble</option>
                    <option value="Kinera">Kinera</option>
                    <option value="Moldeo">Moldeo</option>
                    <option value="Boligrafo">Bolígrafo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad Total de Tarimas:</label>
                <input type="number" id="tarima-total-input" min="1" required value="1">
            </div>
            <button type="submit" id="submit-btn" class="button primary-action-green">
                <i class="fas fa-map-marker-alt"></i> Asignar Huecos
            </button>
        </form>
        
        <div id="asignacion-section" style="display:none; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
            <h3><i class="fas fa-list-ol"></i> Definir Tamaños y Confirmar</h3>
            <div id="tarimas-inputs"></div>
            <button id="confirmar-registro-btn" class="button primary-action-green" style="margin-top: 20px; background-color: #005f9e;">
                <i class="fas fa-check-circle"></i> Confirmar Registro
            </button>
        </div>
        <div id="message"></div>
    </div>
    
    <script>
        const API_URL = '/.netlify/functions/gestion-pulmon'; 
        const registroForm = document.getElementById('registro-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const asignacionSection = document.getElementById('asignacion-section');
        const tarimasInputsDiv = document.getElementById('tarimas-inputs');
        const confirmarRegistroBtn = document.getElementById('confirmar-registro-btn');

        let huecosDisponiblesPorTamano = {}; 
        let tarimasPendientes = []; 

        function showMessage(text, isError = false) {
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
            messageDiv.style.display = 'block';
        }
        
        function disableForm(disabled) {
            submitBtn.disabled = disabled;
            document.getElementById('op-input').disabled = disabled;
            document.getElementById('area-select').disabled = disabled;
            document.getElementById('tarima-total-input').disabled = disabled;
        }

        async function buscarHuecosYAsignar() {
            messageDiv.style.display = 'none';
            disableForm(true); 

            const op = document.getElementById('op-input').value.trim();
            const totalTarimas = parseInt(document.getElementById('tarima-total-input').value, 10);
            const area = document.getElementById('area-select').value;

            try {
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Buscando...';
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'buscar_huecos_disponibles_por_tamano' }),
                });
                
                if (!response.ok) throw new Error('Error conexión.');
                const data = await response.json();
                huecosDisponiblesPorTamano = data.huecos || {};

                tarimasPendientes = [];
                for (let i = 1; i <= totalTarimas; i++) {
                    tarimasPendientes.push({
                        tarimaNumStr: `${i} de ${totalTarimas}`,
                        hueco: null, op: op, area: area, tamano: '' 
                    });
                }

                renderAsignacionInputs();
                asignacionSection.style.display = 'block';
                confirmarRegistroBtn.disabled = false; 

            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
                disableForm(false);
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Asignar Huecos';
            }
        }
        
        function renderAsignacionInputs() {
            let html = '';
            tarimasPendientes.forEach((tarima, index) => {
                const hasGR = huecosDisponiblesPorTamano['GR'] && huecosDisponiblesPorTamano['GR'].length > 0;
                const hasCH = huecosDisponiblesPorTamano['CH'] && huecosDisponiblesPorTamano['CH'].length > 0;
                
                let huecoDisplay = tarima.hueco ? (tarima.hueco === 'PASILLO' ? 
                    '<span style="color:#dc3545; font-weight:bold;">PASILLO</span>' : 
                    `<span style="color:#28a745; font-weight:bold;">${tarima.hueco}</span>`) : 
                    '<span style="color:#777;">PENDIENTE</span>';

                html += `
                    <div class="panel-card">
                        <h4 style="margin:0 0 10px 0;">Tarima ${tarima.tarimaNumStr}</h4>
                        <div class="form-group" style="margin-bottom: 5px;">
                            <select id="tamano-select-${index}" onchange="asignarHueco(${index}, this.value)" required>
                                <option value="" disabled selected>-- Tamaño --</option>
                                <option value="GR" ${!hasGR && tarima.hueco !== 'PASILLO' && !tarima.tamano ? 'disabled' : ''}>GRANDE ${!hasGR ? '(Lleno)' : ''}</option>
                                <option value="CH" ${!hasCH && tarima.hueco !== 'PASILLO' && !tarima.tamano ? 'disabled' : ''}>CHICO ${!hasCH ? '(Lleno)' : ''}</option>
                                <option value="PASILLO">PASILLO (Ilimitado)</option>
                            </select>
                        </div>
                        <p style="margin:0; font-size:0.9em;">Asignado: ${huecoDisplay}</p>
                    </div>`;
            });
            tarimasInputsDiv.innerHTML = html;
            
            tarimasPendientes.forEach((t, i) => {
                 const sel = document.getElementById(`tamano-select-${i}`);
                 if (sel && t.tamano) sel.value = t.tamano;
            });
        }

        window.asignarHueco = function(index, tamano) {
            const tarima = tarimasPendientes[index];
            
            // Deshacer asignación previa si era de rack
            if (tarima.hueco && tarima.hueco !== 'PASILLO') {
                const tipoPrev = tarima.hueco.slice(-2).toUpperCase();
                if (huecosDisponiblesPorTamano[tipoPrev]) {
                     huecosDisponiblesPorTamano[tipoPrev].push(tarima.hueco);
                     huecosDisponiblesPorTamano[tipoPrev].sort();
                }
            }

            if (tamano === 'PASILLO') {
                tarima.hueco = 'PASILLO';
            } else if (huecosDisponiblesPorTamano[tamano] && huecosDisponiblesPorTamano[tamano].length > 0) {
                tarima.hueco = huecosDisponiblesPorTamano[tamano].shift();
            } else {
                alert("No hay huecos disponibles de ese tamaño. Seleccione Pasillo.");
                tarima.hueco = null;
                tarima.tamano = '';
                renderAsignacionInputs();
                return;
            }
            tarima.tamano = tamano;
            renderAsignacionInputs();
        }

        confirmarRegistroBtn.addEventListener('click', async () => {
            if (tarimasPendientes.some(t => !t.hueco)) {
                alert('Asigne tamaño a todas las tarimas.'); return;
            }
            confirmarRegistroBtn.disabled = true;
            confirmarRegistroBtn.innerHTML = '...';

            try {
                for (const t of tarimasPendientes) {
                    await fetch(API_URL, {
                        method: 'POST', headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({
                            action: 'registrar_entrada',
                            hueco: t.hueco, op: t.op, area: t.area, tarimaNumStr: t.tarimaNumStr
                        })
                    });
                }
                showMessage(`✅ Registro completado.`, false);
                setTimeout(() => window.location.reload(), 2500);
            } catch (e) { showMessage(`Error: ${e.message}`, true); }
        });

        registroForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const op = document.getElementById('op-input').value;
            if (op.length !== 7 || isNaN(op)) { showMessage('OP inválida.', true); return; }
            buscarHuecosYAsignar();
        });
    </script>
</body>
</html>
