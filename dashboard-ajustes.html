<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ajustes de Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <style>
        /* --- ESTILOS MEJORADOS --- */
        
        /* NUEVO: Fondo sutil para la página para dar contraste */
        body.inspector-body {
            background-color: #f4f7fa;
        }

        .main-content {
            padding: 20px;
        }

        .dashboard-panel {
            background-color: #ffffff;
            border-radius: 12px; /* Bordes un poco más redondeados */
            padding: 25px;
            /* Sombra más suave y profesional */
            box-shadow: 0 6px 20px rgba(0, 86, 179, 0.08); 
            margin-bottom: 25px; 
            border: 1px solid #eef2f7; /* Borde sutil */
        }

        .panel-title {
            font-size: 1.7em; /* Ajuste de tamaño de fuente */
            color: #343a40;
            margin-bottom: 20px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .panel-title .fas {
            margin-right: 12px;
            color: #0056b3;
        }
        
        #chart-container {
            position: relative;
            height: 420px; /* Un poco más de altura */
            width: 100%;
            margin-bottom: 30px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 1.05em; /* Ajuste de fuente */
        }

        .results-table th,
        .results-table td {
            border: 1px solid #dee2e6;
            padding: 14px 16px; /* Más espaciado */
            text-align: left;
        }

        .results-table th {
            background-color: #f8f9fa;
            font-weight: 600; /* Fuente semi-bold */
            color: #495057;
        }

        .results-table tbody tr:nth-child(even) {
            background-color: #f9fafc;
        }
        
        .results-table tbody tr:hover {
            background-color: #e9ecef;
        }

        .status-message {
            text-align: center;
            font-size: 1.2em;
            color: #6c757d;
            padding: 40px;
        }
    </style>
</head>
<body class="inspector-body">
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="imagenes/Logo azor.png" alt="Logo Grupo Azor" class="logo">
                <h1>Dashboard <span class="ia-badge">AZOR</span></h1>
            </div>
            <nav class="main-nav">
                 <ul>
                    <li><a href="index.html">Inicio</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">
            <section class="dashboard-panel">
                <h2 class="panel-title">
                    <i class="fas fa-chart-line"></i>
                    Tendencia Mensual de Ajustes
                </h2>
                <div id="chart-container">
                    <canvas id="ajustes-chart"></canvas>
                </div>
            </section>
            
            <section class="dashboard-panel">
                 <h2 class="panel-title">
                    <i class="fas fa-table"></i>
                    Datos de Ajustes de Inventario
                </h2>
                <div id="table-container">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Mes</th>
                                <th>Valor de Ajuste</th>
                            </tr>
                        </thead>
                        <tbody id="ajustes-table-body">
                            <tr>
                                <td colspan="2" class="status-message">
                                    <i class="fas fa-spinner fa-spin"></i> Cargando datos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            &copy; <span id="currentYear"></span> Grupo Azor México.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // NUEVO: 2. Registramos el plugin de etiquetas para que Chart.js lo pueda usar
            Chart.register(ChartDataLabels);

            const tablaBody = document.getElementById('ajustes-table-body');
            const netlifyFunctionUrl = '/.netlify/functions/leer-sheet-ajustesinv';
            
            function crearGrafico(meses, valores) {
                const ctx = document.getElementById('ajustes-chart').getContext('2d');

                // NUEVO: Creación del gradiente para el fondo del gráfico
                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(0, 86, 179, 0.4)'); // Color superior del gradiente
                gradient.addColorStop(1, 'rgba(0, 86, 179, 0.05)'); // Color inferior (casi transparente)
                
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: meses,
                        datasets: [{
                            label: 'Valor de Ajuste',
                            data: valores,
                            fill: true, // Habilita el relleno debajo de la línea
                            backgroundColor: gradient, // NUEVO: Usamos el gradiente como fondo
                            borderColor: 'rgba(0, 86, 179, 1)',
                            borderWidth: 3,
                            pointBackgroundColor: 'rgba(0, 86, 179, 1)',
                            pointRadius: 5, // Puntos un poco más grandes
                            pointHoverRadius: 8, // Se hacen más grandes al pasar el cursor
                            tension: 0.2 // Curvatura más suave
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: '#eef2f7' // Líneas de la cuadrícula más sutiles
                                },
                                ticks: {
                                    callback: function(value) {
                                        return value.toLocaleString('es-MX');
                                    }
                                }
                            },
                            x: {
                                grid: {
                                    display: false // Ocultamos la cuadrícula vertical
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false, // Ocultamos la leyenda para un look más limpio
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                displayColors: false, // No mostrar el cuadrito de color en el tooltip
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            label += context.parsed.y.toLocaleString('es-MX');
                                        }
                                        return label;
                                    }
                                }
                            },
                            // NUEVO: 3. Configuración para las etiquetas de datos
                            datalabels: {
                                anchor: 'end', // Posición de la etiqueta (al final de la línea)
                                align: 'top', // Alineación (arriba del punto)
                                color: '#002b59', // Color oscuro para la fuente
                                font: {
                                    weight: 'bold', // Fuente en negrita
                                    size: 12,
                                },
                                // Formato del número que se muestra
                                formatter: function(value, context) {
                                    // Muestra el número formateado con comas
                                    return value.toLocaleString('es-MX');
                                }
                            }
                        },
                        // Mejora la interacción al pasar el cursor
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                    }
                });
            }

            fetch(netlifyFunctionUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    tablaBody.innerHTML = ''; 
                    if (data && data.length > 0) {
                        const meses = data.map(fila => fila[0]);
                        const valores = data.map(fila => parseFloat(String(fila[1]).replace(/,/g, '')));
                        
                        data.forEach(fila => {
                            const tr = document.createElement('tr');
                            const tdMes = document.createElement('td');
                            tdMes.textContent = fila[0] || 'N/A';
                            const tdAjuste = document.createElement('td');
                            const valorNumerico = parseFloat(String(fila[1]).replace(/,/g, ''));
                            tdAjuste.textContent = !isNaN(valorNumerico) ? valorNumerico.toLocaleString('es-MX') : 'N/A';
                            
                            tr.appendChild(tdMes);
                            tr.appendChild(tdAjuste);
                            tablaBody.appendChild(tr);
                        });
                        
                        crearGrafico(meses, valores);
                    } else {
                        tablaBody.innerHTML = '<tr><td colspan="2" class="status-message">No se encontraron datos.</td></tr>';
                        document.getElementById('chart-container').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error al obtener los datos:', error);
                    tablaBody.innerHTML = `<tr><td colspan="2" class="status-message"><i class="fas fa-exclamation-triangle"></i> No se pudieron cargar los datos.</td></tr>`;
                    document.getElementById('chart-container').style.display = 'none';
                });
        });
    </script>
</body>
</html>
