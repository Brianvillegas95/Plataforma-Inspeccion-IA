<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ajustes de Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- ESTILOS ADAPTADOS DE TU APLICACIÓN --- */
        .main-content {
            padding: 20px;
        }

        .dashboard-panel {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px; /* Espacio entre paneles */
        }

        .panel-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .panel-title .fas {
            margin-right: 12px;
            color: #0056b3;
        }
        
        /* NUEVO: Contenedor para el gráfico para controlar su tamaño */
        #chart-container {
            position: relative;
            height: 400px; /* Altura del gráfico */
            width: 100%;
            margin-bottom: 30px; /* Espacio entre el gráfico y la tabla */
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .results-table th,
        .results-table td {
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            text-align: left;
        }

        .results-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #495057;
        }

        .results-table tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        
        .results-table tbody tr:hover {
            background-color: #e9ecef;
        }

        .status-message {
            text-align: center;
            font-size: 1.2em;
            color: #6c757d;
            padding: 40px;
        }
    </style>
</head>
<body class="inspector-body">
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="imagenes/Logo azor.png" alt="Logo Grupo Azor" class="logo">
                <h1>Dashboard <span class="ia-badge">AZOR</span></h1>
            </div>
            <nav class="main-nav">
                 <ul>
                    <li><a href="index.html">Inicio</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">
            <section class="dashboard-panel">
                <h2 class="panel-title">
                    <i class="fas fa-chart-line"></i>
                    Tendencia Mensual de Ajustes
                </h2>
                <div id="chart-container">
                    <canvas id="ajustes-chart"></canvas>
                </div>
            </section>
            
            <section class="dashboard-panel">
                 <h2 class="panel-title">
                    <i class="fas fa-table"></i>
                    Datos de Ajustes de Inventario
                </h2>
                <div id="table-container">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Mes</th>
                                <th>Valor de Ajuste</th>
                            </tr>
                        </thead>
                        <tbody id="ajustes-table-body">
                            <tr>
                                <td colspan="2" class="status-message">
                                    <i class="fas fa-spinner fa-spin"></i> Cargando datos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            &copy; <span id="currentYear"></span> Grupo Azor México.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            const tablaBody = document.getElementById('ajustes-table-body');
            const netlifyFunctionUrl = '/.netlify/functions/leer-sheet-ajustesinv';
            
            // NUEVO: 3. Función para dibujar el gráfico
            function crearGrafico(meses, valores) {
                const ctx = document.getElementById('ajustes-chart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'line', // Tipo de gráfico: línea
                    data: {
                        labels: meses, // Eje X: los meses
                        datasets: [{
                            label: 'Valor de Ajuste', // Etiqueta para la leyenda
                            data: valores, // Eje Y: los valores
                            backgroundColor: 'rgba(0, 86, 179, 0.2)', // Relleno semitransparente
                            borderColor: 'rgba(0, 86, 179, 1)', // Color de la línea
                            borderWidth: 3, // Grosor de la línea
                            pointBackgroundColor: 'rgba(0, 86, 179, 1)', // Color de los puntos
                            pointRadius: 5, // Tamaño de los puntos
                            tension: 0.1 // Curvatura de la línea
                        }]
                    },
                    options: {
                        responsive: true, // El gráfico se ajusta al tamaño del contenedor
                        maintainAspectRatio: false, // Permite controlar la altura de forma flexible
                        scales: {
                            y: {
                                beginAtZero: true, // El eje Y empieza en 0
                                ticks: {
                                    callback: function(value, index, values) {
                                        // Formatea los números del eje Y con comas
                                        return value.toLocaleString('es-MX');
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top', // Posición de la leyenda
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            // Formatea los números dentro del tooltip
                                            label += context.parsed.y.toLocaleString('es-MX');
                                        }
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
            }

            fetch(netlifyFunctionUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error del servidor: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    tablaBody.innerHTML = ''; 

                    if (data && data.length > 0) {
                        // NUEVO: 4. Preparamos los datos para el gráfico y la tabla
                        const meses = data.map(fila => fila[0]); // Obtenemos todos los meses
                        // Convertimos los valores a número, eliminando comas si las hubiera
                        const valores = data.map(fila => parseFloat(String(fila[1]).replace(/,/g, '')));
                        
                        // Rellenamos la tabla (mismo código de antes)
                        data.forEach(fila => {
                            const tr = document.createElement('tr');
                            const tdMes = document.createElement('td');
                            tdMes.textContent = fila[0] || 'N/A';
                            const tdAjuste = document.createElement('td');
                            // Formateamos el número en la tabla para que tenga comas
                            const valorNumerico = parseFloat(String(fila[1]).replace(/,/g, ''));
                            tdAjuste.textContent = !isNaN(valorNumerico) ? valorNumerico.toLocaleString('es-MX') : 'N/A';
                            
                            tr.appendChild(tdMes);
                            tr.appendChild(tdAjuste);
                            tablaBody.appendChild(tr);
                        });
                        
                        // ¡Llamamos a la función para que dibuje el gráfico con los datos!
                        crearGrafico(meses, valores);

                    } else {
                        tablaBody.innerHTML = '<tr><td colspan="2" class="status-message">No se encontraron datos para mostrar.</td></tr>';
                        // Opcional: Ocultar el contenedor del gráfico si no hay datos
                        document.getElementById('chart-container').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error al obtener los datos:', error);
                    tablaBody.innerHTML = `<tr><td colspan="2" class="status-message"><i class="fas fa-exclamation-triangle"></i> No se pudieron cargar los datos. Por favor, inténtalo más tarde.</td></tr>`;
                    // Ocultar el contenedor del gráfico si hay un error
                    document.getElementById('chart-container').style.display = 'none';
                });
        });
    </script>
</body>
</html>
