<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Recursos en Planta</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/format/index.min.js"></script>

    <style>
        :root {
            --font-family: 'Poppins', sans-serif;
            --color-progress: #0d6efd;
            --color-success: #198754;
            --color-primary-text: #212529;
            --color-secondary-text: #6c757d;
        }
        body { font-family: var(--font-family); background-color: #f4f7f9; }
        
        .kpi-bar {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; margin-bottom: 20px;
        }
        .kpi-item {
            background-color: var(--surface-bg); padding: 20px;
            border-radius: var(--border-radius); box-shadow: var(--shadow-sm);
        }
        .kpi-item .label { font-size: 0.9em; color: var(--color-secondary-text); margin-bottom: 8px; }
        .kpi-item .value { font-size: 2.5em; font-weight: 700; color: var(--color-primary-text); }

        .resource-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
        }
        .resource-card {
            background-color: var(--surface-bg); border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
            border-top: 5px solid var(--color-progress);
        }
        .resource-card.completed { border-top-color: var(--color-success); }
        
        .card-header { padding: 20px; }
        .card-header h3 { font-size: 1.5em; margin: 0; color: var(--color-primary-text); }
        .card-header p { font-size: 1em; color: var(--color-secondary-text); margin: 4px 0 0 0; }
        
        .card-body { display: flex; padding: 0 20px 20px 20px; gap: 20px; align-items: center; }
        .chart-container { width: 130px; height: 130px; flex-shrink: 0; }
        
        .details { flex-grow: 1; }
        .details .metric { margin-bottom: 12px; }
        .details .metric .label { font-size: 0.8em; text-transform: uppercase; color: var(--color-secondary-text); }
        .details .metric .value { font-size: 1.4em; font-weight: 600; color: var(--color-primary-text); }
        
        .card-footer {
            padding: 15px 20px; border-top: 1px solid #e9ecef;
            background-color: #fcfcfc; font-size: 0.9em;
            display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header"> </header>
        <main class="main-content">
            <section class="tool-section">
                <div class="section-header">
                    <span class="feature-icon"><i class="fa-solid fa-server"></i></span>
                    <h2>Jobs Liberados</h2>
                    <p>Monitor de Actividad de Recursos en Piso.</p>
                </div>
                
                <div id="kpi-bar" class="kpi-bar"></div>

                <div class="panel-card" style="margin-top: 20px;">
                     <h3 class="panel-title-sub"><i class="fas fa-filter"></i> Filtros</h3>
                     </div>

                <div id="resource-grid" class="resource-grid" style="margin-top: 20px;">
                    <p id="loading-indicator"><i class="fas fa-spinner fa-spin"></i> Cargando estado de recursos...</p>
                </div>
            </section>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const API_ENDPOINT = '/.netlify/functions/leer-prod-data';
    let allResources = [];

    const kpiBar = document.getElementById('kpi-bar');
    const resourceGrid = document.getElementById('resource-grid');
    const loadingIndicator = document.getElementById('loading-indicator');

    function formatDate(dateString) {
        if (!dateString) return "Sin Fecha";
        try {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return "Fecha Inválida";
            return date.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
        } catch (e) { return "Sin Fecha"; }
    }

    async function fetchData() {
        try {
            const response = await fetch(API_ENDPOINT);
            if (!response.ok) throw new Error((await response.json()).details || 'Error del robot.');
            allResources = await response.json();
            updateDashboard();
        } catch (error) {
            loadingIndicator.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
        }
    }

    function updateDashboard() {
        const filteredResources = allResources; // Lógica de filtros iría aquí

        filteredResources.sort((a, b) => (new Date(a.startDate) || 0) - (new Date(b.startDate) || 0));

        renderKPIs(filteredResources);
        renderResourceCards(filteredResources);
    }

    function renderKPIs(resources) {
        const totalJobs = [...new Set(resources.map(r => r.job))].length;
        const resourcesWithProgress = resources.filter(r => parseFloat(r.progress) > 0).length;
        const totalResources = resources.length;

        kpiBar.innerHTML = `
            <div class="kpi-item"><div class="label">Jobs Activos</div><div class="value">${totalJobs}</div></div>
            <div class="kpi-item"><div class="label">Recursos Trabajando</div><div class="value">${totalResources}</div></div>
            <div class="kpi-item"><div class="label">Recursos con Avance</div><div class="value">${resourcesWithProgress}</div></div>
        `;
    }

    function renderResourceCards(resources) {
        loadingIndicator.style.display = 'none';
        resourceGrid.innerHTML = '';

        resources.forEach(resource => {
            const card = document.createElement('div');
            const progress = parseFloat(resource.progress);
            card.className = `resource-card ${progress >= 99.9 ? 'completed' : ''}`;
            const chartId = `chart-${resource.resourceName}-${resource.job}`;

            card.innerHTML = `
                <div class="card-header">
                    <h3>${resource.resourceName}</h3>
                    <p>Departamento: ${resource.department}</p>
                </div>
                <div class="card-body">
                    <div class="chart-container" id="${chartId}"></div>
                    <div class="details">
                        <div class="metric">
                            <div class="label">JOB / ASSEMBLY</div>
                            <div class="value">${resource.job} / ${resource.assembly}</div>
                        </div>
                        <div class="metric">
                            <div class="label">FABRICADAS / REQUERIDAS</div>
                            <div class="value">${Math.round(resource.appliedQty).toLocaleString('es-MX')} / ${Math.round(resource.requiredQty).toLocaleString('es-MX')}</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <span><strong>Inicio:</strong> ${formatDate(resource.startDate)}</span>
                    <span><strong>Fin Prog:</strong> ${formatDate(resource.completionDate)}</span>
                </div>
            `;
            resourceGrid.appendChild(card);
            renderChart(chartId, progress);
        });
    }

    function renderChart(chartId, progress) {
        const options = {
            chart: { type: 'radialBar', height: '100%' },
            series: [progress],
            plotOptions: {
                radialBar: {
                    hollow: { size: '70%' },
                    dataLabels: {
                        name: { show: false },
                        value: { fontSize: '24px', fontWeight: 600, offsetY: 8, formatter: (val) => val + '%' }
                    }
                }
            },
            colors: [progress >= 99.9 ? 'var(--color-success)' : 'var(--color-progress)'],
            stroke: { lineCap: 'round' }
        };
        const chart = new ApexCharts(document.querySelector(`#${chartId}`), options);
        chart.render();
    }

    fetchData();
});
</script>
</body>
</html>
