<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Producción en Planta</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .main-content { background-color: #f4f7f9; }
        .department-section { margin-bottom: 30px; }
        .department-header {
            font-size: 1.5em; font-weight: 700; color: var(--text-primary);
            padding-bottom: 10px; border-bottom: 3px solid var(--azor-blue);
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .resource-card {
            background-color: var(--surface-bg); border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm); border-top: 4px solid var(--status-inprogress);
            display: flex; flex-direction: column; transition: all 0.2s ease-in-out;
        }
        .resource-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .resource-card.delayed { border-top-color: var(--status-delayed); }
        .resource-card.completed { border-top-color: var(--status-ontrack); }

        .card-main-content { display: flex; align-items: center; padding: 15px; gap: 15px; }
        .progress-chart-container { position: relative; width: 100px; height: 100px; }
        .progress-chart-container .progress-value {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.4em; font-weight: 700; color: var(--text-primary);
        }
        .card-info { flex-grow: 1; }
        .card-info h4 { margin: 0; font-size: 1.2em; font-weight: 600; }
        .card-info .assembly-name { font-size: 0.9em; color: var(--text-secondary); margin-top: 2px; }
        .card-info .resource-name { font-size: 1em; font-weight: 500; color: var(--azor-blue); margin-top: 8px; }

        .card-footer-stats {
            display: grid; grid-template-columns: 1fr 1fr;
            padding: 10px 15px; background-color: #f8f9fa; border-top: 1px solid var(--border-color);
        }
        .stat { font-size: 0.9em; }
        .stat .label { color: var(--text-secondary); }
        .stat .value { font-weight: 600; color: var(--text-primary); }

        .linked-resource {
            background-color: #e9ecef; margin: 0 15px 15px 15px;
            padding: 10px; border-radius: var(--border-radius-sm); display: flex;
            align-items: center; gap: 10px; border-left: 3px solid #6c757d;
        }
        .linked-resource .icon { font-size: 1.2em; color: #6c757d; }
        .linked-resource .text { font-weight: 500; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            </header>

        <main class="main-content">
            <section class="tool-section">
                <div class="section-header">
                    <span class="feature-icon"><i class="fa-solid fa-camera"></i></span>
                    <h2>Fotografía de la Planta</h2>
                    <p>Visualización en tiempo real del estado de los recursos de producción.</p>
                </div>
                
                <div class="panel-card" style="margin-bottom: 20px;">
                    </div>

                <div id="dashboard-container">
                    <p id="loading-indicator"><i class="fas fa-spinner fa-spin"></i> Obteniendo la fotografía de la planta...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_ENDPOINT = '/.netlify/functions/leer-prod-data';
        const dashboardContainer = document.getElementById('dashboard-container');
        const loadingIndicator = document.getElementById('loading-indicator');

        // Función para crear el gráfico de dona
        function createProgressChart(canvasId, progress) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const data = {
                datasets: [{
                    data: [progress, 100 - progress],
                    backgroundColor: [ progress > 99 ? '#28a745' : '#007bff', '#e9ecef'],
                    borderColor: 'rgba(0,0,0,0)',
                    borderRadius: 5,
                    cutout: '75%'
                }]
            };
            new Chart(ctx, { type: 'doughnut', data: data, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
        }

        async function fetchData() {
            try {
                const response = await fetch(API_ENDPOINT);
                if (!response.ok) throw new Error((await response.json()).details || 'La respuesta del robot no fue exitosa.');
                const jobs = await response.json();
                renderDashboard(jobs);
            } catch (error) {
                loadingIndicator.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
            }
        }

        function renderDashboard(jobs) {
            loadingIndicator.style.display = 'none';
            dashboardContainer.innerHTML = '';

            // 1. Agrupar jobs por departamento
            const jobsByDept = jobs.reduce((acc, job) => {
                const dept = job.department || 'Sin Departamento';
                if (!acc[dept]) acc[dept] = [];
                acc[dept].push(job);
                return acc;
            }, {});

            // 2. Renderizar cada sección de departamento
            for (const department in jobsByDept) {
                const deptSection = document.createElement('section');
                deptSection.className = 'department-section';
                deptSection.innerHTML = `<h2 class="department-header"><i class="fa-solid fa-industry"></i> ${department}</h2>`;
                
                const grid = document.createElement('div');
                grid.className = 'resource-grid';

                jobsByDept[department].forEach(job => {
                    const card = document.createElement('div');
                    const progress = parseFloat(job.progress);
                    
                    let cardStatusClass = '';
                    if (job.isDelayed) cardStatusClass = 'delayed';
                    else if (progress >= 100) cardStatusClass = 'completed';

                    card.className = `resource-card ${cardStatusClass}`;
                    const canvasId = `chart-${job.job}`;
                    
                    // Lógica para identificar máquina y molde
                    const mainResource = job.resources.find(r => !r.name.startsWith('MM') && !r.name.startsWith('MEB'));
                    const linkedResource = job.resources.find(r => r.name.startsWith('MM') || r.name.startsWith('MEB'));

                    card.innerHTML = `
                        <div class="card-main-content">
                            <div class="progress-chart-container">
                                <canvas id="${canvasId}"></canvas>
                                <div class="progress-value">${progress.toFixed(0)}%</div>
                            </div>
                            <div class="card-info">
                                <h4>Job: ${job.job}</h4>
                                <p class="assembly-name">${job.assembly}</p>
                                <p class="resource-name">${mainResource ? mainResource.name : 'N/A'}</p>
                            </div>
                        </div>
                        
                        ${linkedResource ? `
                        <div class="linked-resource">
                            <span class="icon"><i class="fa-solid fa-puzzle-piece"></i></span>
                            <span class="text">${linkedResource.name}: ${linkedResource.description || ''}</span>
                        </div>` : ''}

                        <div class="card-footer-stats">
                            <div class="stat">
                                <div class="label">Fabricadas / Requeridas</div>
                                <div class="value">${Math.round(job.appliedQty).toLocaleString('es-MX')} / ${Math.round(job.requiredQty).toLocaleString('es-MX')}</div>
                            </div>
                            <div class="stat">
                                <div class="label">Fecha Fin Programada</div>
                                <div class="value">${job.completionDate ? new Date(job.completionDate).toLocaleDateString('es-MX') : 'N/A'}</div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                    // Retrasamos la creación del gráfico un instante para asegurar que el canvas esté en el DOM
                    setTimeout(() => createProgressChart(canvasId, progress), 0);
                });
                deptSection.appendChild(grid);
                dashboardContainer.appendChild(deptSection);
            }
        }
        
        fetchData();
    });
    </script>
</body>
</html>
