<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando de Producción</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Poppins', sans-serif;
            --color-running: #28a745; --bg-running: #e9f6ec;
            --color-idle: #ffc107;    --bg-idle: #fff8e5;
            --color-down: #dc3545;     --bg-down: #fceaea;
            --color-neutral: #6c757d; --bg-neutral: #f8f9fa;
        }
        body { font-family: var(--font-family); }
        .main-content { background-color: #f8f9fa; }

        /* Estilos de la Cuadrícula de Recursos */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .resource-card {
            background-color: var(--surface-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--color-neutral);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .resource-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); cursor: pointer; }

        /* Estados de la Tarjeta */
        .resource-card[data-status="Running"] { border-left-color: var(--color-running); }
        .resource-card[data-status="Idle"] { border-left-color: var(--color-idle); }
        .resource-card[data-status="Down"] { border-left-color: var(--color-down); }

        .card-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { margin: 0; font-size: 1.2em; font-weight: 600; color: var(--text-primary); }
        .status-tag {
            padding: 4px 10px; border-radius: 12px; font-size: 0.8em;
            font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
        .status-tag.running { color: var(--color-running); background-color: var(--bg-running); }
        .status-tag.idle { color: var(--color-idle); background-color: var(--bg-idle); }
        .status-tag.down { color: var(--color-down); background-color: var(--bg-down); }
        
        .card-body { padding: 0 15px 15px 15px; flex-grow: 1; }
        .job-info h4 { margin: 0; font-size: 1.1em; }
        .job-info p { margin: 2px 0 10px 0; font-size: 0.9em; color: var(--text-secondary); }

        .progress-section { margin-bottom: 15px; }
        .progress-bar-bg { width: 100%; background-color: #e9ecef; border-radius: 6px; height: 12px; }
        .progress-bar-fg { height: 100%; background-color: var(--color-running); border-radius: 6px; }
        
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; }
        .metric .label { color: var(--text-secondary); }
        .metric .value { font-weight: 600; font-size: 1.1em; }

        .card-footer { padding: 12px 15px; background-color: #f8f9fa; border-top: 1px solid var(--border-color); }
        .timeline .label { font-size: 0.8em; color: var(--text-secondary); }
        .timeline-bar-bg { width: 100%; height: 6px; background-color: #dee2e6; border-radius: 3px; margin-top: 4px; }
        
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            </header>
        <main class="main-content">
            <section class="tool-section">
                <div class="section-header">
                    <span class="feature-icon"><i class="fa-solid fa-server"></i></span>
                    <h2>Centro de Mando de Producción</h2>
                    <p>Estado en tiempo real de los recursos en el piso de producción.</p>
                </div>

                <div class="panel-card">
                    <h3 class="panel-title-sub"><i class="fas fa-filter"></i> Controles de Visualización</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;">
                        <div class="form-group"><label for="filter-department">Departamento:</label><select id="filter-department"><option value="">Todos</option></select></div>
                        <div class="form-group"><label for="filter-status">Estado del Recurso:</label>
                            <select id="filter-status">
                                <option value="">Todos</option>
                                <option value="Running">Trabajando</option>
                                <option value="Idle">Inactivo</option>
                            </select>
                        </div>
                        <div class="form-group"><label for="search-resource">Buscar Recurso o Job:</label><input type="text" id="search-resource" placeholder="Escribe para buscar..."></div>
                    </div>
                </div>

                <div id="resource-grid" class="resource-grid" style="margin-top:20px;">
                     <p id="loading-indicator"><i class="fas fa-spinner fa-spin"></i> Cargando estado de la planta...</p>
                </div>
            </section>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const API_ENDPOINT = '/.netlify/functions/leer-prod-data';
    let allJobsData = [];

    // Elementos del DOM
    const resourceGrid = document.getElementById('resource-grid');
    const loadingIndicator = document.getElementById('loading-indicator');
    const filterDepartment = document.getElementById('filter-department');
    const filterStatus = document.getElementById('filter-status');
    const searchResource = document.getElementById('search-resource');

    async function fetchData() {
        try {
            const response = await fetch(API_ENDPOINT);
            if (!response.ok) throw new Error((await response.json()).details || 'Error del robot.');
            
            allJobsData = (await response.json()).map(job => ({
                ...job,
                startDate: job.startDate ? new Date(job.startDate) : null,
                completionDate: job.completionDate ? new Date(job.completionDate) : null,
            }));
            
            populateFilters(allJobsData);
            updateDashboard();
        } catch (error) {
            loadingIndicator.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
        }
    }

    function populateFilters(data) {
        const departments = [...new Set(data.map(item => item.department))].sort();
        filterDepartment.innerHTML = '<option value="">Todos</option>';
        departments.forEach(dept => {
            if (dept) filterDepartment.add(new Option(dept, dept));
        });
    }

    function updateDashboard() {
        const deptFilter = filterDepartment.value;
        const statusFilter = filterStatus.value;
        const searchFilter = searchResource.value.toLowerCase();

        // 1. Desglosar: Un objeto por cada recurso, no por cada job
        let resources = [];
        allJobsData.forEach(job => {
            job.resources.forEach(res => {
                resources.push({ ...res, ...job, resourceName: res.name, resourceDescription: res.description });
            });
        });

        // 2. Filtrar
        const filteredResources = resources.filter(res => {
            // Asignar un estado (lógica de ejemplo)
            const status = res.job ? 'Running' : 'Idle';
            
            const deptMatch = !deptFilter || res.department === deptFilter;
            const statusMatch = !statusFilter || status === statusFilter;
            const searchMatch = !searchFilter || res.resourceName.toLowerCase().includes(searchFilter) || res.job.toLowerCase().includes(searchFilter);
            
            return deptMatch && statusMatch && searchMatch;
        });

        // 3. Ordenar
        filteredResources.sort((a, b) => (a.startDate || 0) - (b.startDate || 0));

        renderGrid(filteredResources);
    }

    function renderGrid(resources) {
        resourceGrid.innerHTML = '';
        if (resources.length === 0) {
            resourceGrid.innerHTML = '<p>No se encontraron recursos con los filtros seleccionados.</p>';
            return;
        }

        resources.forEach(res => {
            const card = document.createElement('div');
            card.className = 'resource-card';
            
            const status = res.job ? 'Running' : 'Idle'; // Lógica de estado simplificada
            const statusText = status === 'Running' ? 'Trabajando' : 'Inactivo';
            card.setAttribute('data-status', status);

            const progress = parseFloat(res.progress);

            card.innerHTML = `
                <div class="card-header">
                    <h3>${res.resourceName}</h3>
                    <div class="status-tag ${status.toLowerCase()}">
                        <i class="fa-solid fa-circle"></i>
                        <span>${statusText}</span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="job-info">
                        <h4>Job: ${res.job || 'N/A'}</h4>
                        <p>${res.assembly || 'Sin orden asignada'}</p>
                    </div>
                    <div class="progress-section">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fg" style="width: ${progress}%;"></div>
                        </div>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric">
                            <div class="label">Fabricadas / Req.</div>
                            <div class="value">${Math.round(res.appliedQty).toLocaleString('es-MX')} / ${Math.round(res.requiredQty).toLocaleString('es-MX')}</div>
                        </div>
                        <div class="metric">
                            <div class="label">Pendientes</div>
                            <div class="value">${Math.round(res.openQty).toLocaleString('es-MX')}</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="timeline">
                        <div class="label">Inicio: ${res.startDate ? res.startDate.toLocaleDateString('es-MX') : 'N/A'} | Fin Prog: ${res.completionDate ? res.completionDate.toLocaleDateString('es-MX') : 'N/A'}</div>
                        <div class="timeline-bar-bg"></div>
                    </div>
                </div>
            `;
            resourceGrid.appendChild(card);
        });
    }
    
    // Event Listeners
    filterDepartment.addEventListener('change', updateDashboard);
    filterStatus.addEventListener('change', updateDashboard);
    searchResource.addEventListener('input', updateDashboard);

    fetchData();
});
</script>
</body>
</html>
