<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección IA v4.2 (Cámara Web Integrada) - Tapon 6800</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        .main-content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; }
        .vision-panel #display-container {
            position: relative; background-color: #e9ecef; border-radius: 4px;
            overflow: hidden; width: 100%; display: flex; align-items: center;
            justify-content: center; min-height: 300px;
        }
        #image-wrapper, #video-wrapper { position: relative; width: 100%; line-height: 0; }
        #uploaded-image, #video-feed, #overlay-canvas, #camera-preview-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #uploaded-image, #video-feed { position: relative; width: 100%; height: auto; display: block; background-color: #000; }
        #overlay-canvas { pointer-events: none; }

        /* NUEVO: Estilos para el control de enfoque */
        #focus-control-container {
            margin-top: 15px;
            padding: 10px;
            background-color: #f0f2f5;
            border-radius: 5px;
            display: none; /* Oculto por defecto */
        }
        #focus-control-container.active {
            display: block; /* Visible cuando la cámara está activa */
        }
        #focus-control-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        #focus-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
            border-radius: 4px;
        }
        #focus-slider:hover { opacity: 1; }
        #focus-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0056b3;
            cursor: pointer;
            border: 2px solid #fff;
        }
        #focus-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0056b3;
            cursor: pointer;
            border: 2px solid #fff;
        }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 15px; }
        #file-input { display: none; }
        .button {
            display: inline-block; padding: 12px 24px; font-size: 1.0em; cursor: pointer;
            text-align: center; text-decoration: none; outline: none; color: #fff;
            background-color: #0056b3; border: none; border-radius: 5px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        .button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.7; }
        .button:hover:not(:disabled) { background-color: #003d82; }
        label.button { background-color: #6c757d; }
        label.button:hover { background-color: #5a6268; }
        .secondary-action {
            grid-column: 1 / -1; background-color: #28a745; color: white;
            font-size: 0.9em; padding: 8px 16px;
        }
        .secondary-action.stop { background-color: #dc3545; }
        .results-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .results-table th, .results-table td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        .results-table th { background-color: #f8f9fa; font-weight: bold; }
    </style>
</head>
<body class="inspector-body">
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="imagenes/Logo azor.png" alt="Logo Grupo Azor" class="logo">
                <h1>Inspección de Calidad <span class="ia-badge">IA</span></h1>
            </div>
        </header>
        <main class="main-content-grid"> 
            <section class="vision-panel">
                <h2 class="panel-title"><i class="fas fa-eye"></i> Visor de Inspección</h2>
                <div id="display-container">
                    <span style="color:#6c757d; font-size: 1.2em;">Sube una imagen o activa la cámara</span>
                </div>
                <div class="label-container" id="label-container">
                    <p>Los resultados del análisis aparecerán aquí.</p>
                </div>
            </section>
            <aside class="controls-panel">
                <h3 class="panel-title"><i class="fas fa-list-ol"></i> Controles</h3>
                <div class="action-buttons">
                    <button id="analyze-button" class="button primary-action" disabled>
                        <i class="fas fa-search"></i> Analizar
                    </button>
                    <label for="file-input" class="button" id="file-label">
                        <i class="fas fa-upload"></i> Subir Imagen
                    </label>
                    <input type="file" id="file-input" accept="image/*">
                </div>
                <button id="camera-button" class="button secondary-action"><i class="fas fa-video"></i> Modo Cámara</button>

                <div id="focus-control-container">
                    <label for="focus-slider"><i class="fas fa-magic"></i> Nivel de Enfoque:</label>
                    <input type="range" id="focus-slider" min="0" max="100" value="0">
                </div>

                <div id="auditor-section"> 
                    <p id="auditor-title">Asistente de Inspección</p>
                    <div id="auditor-image-container">
                        <img id="auditor-image" src="imagenes/Auditor.png" alt="Asistente IA" class="auditor-image-estilizada">
                    </div>
                    <div id="auditor-message-bubble" class="auditor-bubble auditor-bubble-centered"> 
                        <span>Iniciando sistema...</span>
                    </div>
                </div>
            </aside>
        </main>
        <footer class="app-footer">&copy; <span id="currentYear"></span> Grupo Azor México.</footer>
    </div>

    <script type="text/javascript">
        const MODEL_PATH = "./modelos_ia/tapon_6800/tapon.onnx"; 
        const CLASS_NAMES = ['Incompleto', 'Punto Alto', 'Rebaba', 'Sin Defecto'];
        const CLASS_COLORS = ['#FFA500', '#FF4500', '#FFD700', '#2E8B57'];  
        const CONFIDENCE_THRESHOLD = 0.25;
        const IOU_THRESHOLD = 0.45;
        const MODEL_WIDTH = 1280;
        const MODEL_HEIGHT = 1280;

        const analyzeButton = document.getElementById('analyze-button');
        const fileInput = document.getElementById('file-input');
        const fileLabel = document.getElementById('file-label');
        const displayContainer = document.getElementById('display-container');
        const labelContainer = document.getElementById('label-container');
        const auditorBubbleSpan = document.querySelector('#auditor-message-bubble span');
        const cameraButton = document.getElementById('camera-button');
        // NUEVO: Referencias al control de enfoque
        const focusControlContainer = document.getElementById('focus-control-container');
        const focusSlider = document.getElementById('focus-slider');

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        let session;
        let imageSource = null;
        let isModelReady = false;
        let isImageReady = false;

        let videoStream = null;
        let isCameraActive = false;
        // NUEVO: Canvas para previsualización de cámara con filtro
        let cameraPreviewCanvas = null;
        let cameraPreviewCtx = null;
        let videoFeed = null; // Referencia al elemento <video> para el bucle de renderizado

        let animationFrameId = null; // Para controlar el bucle de renderizado

        function setAuditorSpeech(message) {
            if(auditorBubbleSpan) auditorBubbleSpan.textContent = message;
        }

        function checkReadyState() {
            if (isModelReady && isImageReady) {
                analyzeButton.disabled = false;
                setAuditorSpeech('Imagen lista. Presiona Analizar.');
            } else if (isModelReady && !isImageReady) {
                setAuditorSpeech('Modelo listo. Sube una imagen o usa la cámara.');
            } else {
                setAuditorSpeech('Cargando modelo...');
            }
        }
        
        function clearDisplay() {
            displayContainer.innerHTML = '<span style="color:#6c757d; font-size: 1.2em;">Sube una imagen o activa la cámara</span>';
            labelContainer.innerHTML = "<p>Los resultados del análisis aparecerán aquí.</p>";
            imageSource = null;
            isImageReady = false;
            analyzeButton.disabled = true;
        }

        async function startCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                    isCameraActive = true;
                    setAuditorSpeech('Cámara activada. Ajusta el enfoque.');
                    
                    displayContainer.innerHTML = '';
                    const wrapper = document.createElement('div');
                    wrapper.id = 'video-wrapper';

                    videoFeed = document.createElement('video'); // Referencia actualizada
                    videoFeed.id = 'video-feed';
                    videoFeed.srcObject = videoStream;
                    videoFeed.autoplay = true;
                    videoFeed.playsInline = true;
                    videoFeed.style.display = 'none'; // Ocultar el video directo, usaremos el canvas

                    cameraPreviewCanvas = document.createElement('canvas'); // NUEVO: Canvas para la previsualización
                    cameraPreviewCanvas.id = 'camera-preview-canvas';
                    cameraPreviewCtx = cameraPreviewCanvas.getContext('2d');
                    
                    wrapper.appendChild(videoFeed);
                    wrapper.appendChild(cameraPreviewCanvas);
                    displayContainer.appendChild(wrapper);

                    // Asegurarse de que el video esté listo antes de dibujar en canvas
                    videoFeed.onloadedmetadata = () => {
                        cameraPreviewCanvas.width = videoFeed.videoWidth;
                        cameraPreviewCanvas.height = videoFeed.videoHeight;
                        // Iniciar el bucle de renderizado solo cuando el video esté listo
                        animationFrameId = requestAnimationFrame(renderCameraFrame);
                    };

                    // Actualizar UI
                    cameraButton.innerHTML = '<i class="fas fa-camera"></i> Capturar y Analizar';
                    cameraButton.classList.remove('secondary-action');
                    cameraButton.classList.add('primary-action');

                    const stopButton = document.createElement('button');
                    stopButton.innerHTML = '<i class="fas fa-stop-circle"></i> Detener Cámara';
                    stopButton.className = 'button secondary-action stop';
                    stopButton.onclick = stopCamera;
                    cameraButton.parentNode.insertBefore(stopButton, cameraButton.nextSibling);

                    fileLabel.style.display = 'none';
                    analyzeButton.style.display = 'none';
                    focusControlContainer.classList.add('active'); // Mostrar control de enfoque
                    focusSlider.value = 0; // Resetear el slider al activar la cámara

                } catch (error) {
                    console.error("Error al acceder a la cámara:", error);
                    setAuditorSpeech('No se pudo acceder a la cámara. Asegúrate de dar permisos.');
                    isCameraActive = false;
                }
            } else {
                setAuditorSpeech('Tu navegador no soporta la API de cámara.');
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            isCameraActive = false;
            videoStream = null;
            videoFeed = null;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId); // Detener el bucle de renderizado
                animationFrameId = null;
            }
            
            // Restaurar UI
            cameraButton.innerHTML = '<i class="fas fa-video"></i> Modo Cámara';
            cameraButton.classList.remove('primary-action');
            cameraButton.classList.add('secondary-action');
            
            const stopButton = document.querySelector('.button.stop');
            if (stopButton) stopButton.remove();
            
            fileLabel.style.display = 'inline-block';
            analyzeButton.style.display = 'inline-block';
            focusControlContainer.classList.remove('active'); // Ocultar control de enfoque

            // Si no hay una imagen analizada, limpiar el display
            if (!isImageReady) {
                clearDisplay();
            }
            setAuditorSpeech('Cámara detenida. Sube una imagen o activa la cámara.');
        }

        // NUEVO: Bucle para renderizar el video en el canvas con el filtro de enfoque
        function renderCameraFrame() {
            if (!videoFeed || videoFeed.paused || videoFeed.ended || !isCameraActive || !cameraPreviewCtx) {
                return;
            }

            // Dibuja el frame del video en el canvas de previsualización
            cameraPreviewCtx.drawImage(videoFeed, 0, 0, cameraPreviewCanvas.width, cameraPreviewCanvas.height);

            // Aplica el filtro de nitidez si el slider no está en 0
            const focusLevel = parseFloat(focusSlider.value);
            if (focusLevel > 0) {
                applySharpenFilter(cameraPreviewCtx, cameraPreviewCanvas, focusLevel);
            }

            animationFrameId = requestAnimationFrame(renderCameraFrame);
        }

        // NUEVO: Función para aplicar el filtro de nitidez (sharpness)
        function applySharpenFilter(ctx, canvas, level) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const width = canvas.width;
            const height = canvas.height;

            // Kernel de nitidez (ejemplo básico, se puede refinar)
            // Un valor de 'level' alto hará el filtro más intenso.
            // Aquí lo escalamos para que 0 sea sin efecto y 100 sea un efecto notable.
            const factor = level / 100 * 2.5; // Ajusta el multiplicador según la intensidad deseada
            const kernel = [
                0, -factor, 0,
                -factor, 1 + (4 * factor), -factor,
                0, -factor, 0
            ];
            const kernelSize = 3;
            const kernelMiddle = Math.floor(kernelSize / 2);

            const outputPixels = new Uint8ClampedArray(pixels.length);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;

                    for (let ky = 0; ky < kernelSize; ky++) {
                        for (let kx = 0; kx < kernelSize; kx++) {
                            const pixelX = x + kx - kernelMiddle;
                            const pixelY = y + ky - kernelMiddle;

                            if (pixelX >= 0 && pixelX < width && pixelY >= 0 && pixelY < height) {
                                const index = (pixelY * width + pixelX) * 4;
                                const kernelValue = kernel[ky * kernelSize + kx];

                                r += pixels[index] * kernelValue;
                                g += pixels[index + 1] * kernelValue;
                                b += pixels[index + 2] * kernelValue;
                            }
                        }
                    }
                    const outputIndex = (y * width + x) * 4;
                    outputPixels[outputIndex] = Math.min(255, Math.max(0, r));
                    outputPixels[outputIndex + 1] = Math.min(255, Math.max(0, g));
                    outputPixels[outputIndex + 2] = Math.min(255, Math.max(0, b));
                    outputPixels[outputIndex + 3] = pixels[outputIndex + 3]; // Alpha channel
                }
            }
            ctx.putImageData(new ImageData(outputPixels, width, height), 0, 0);
        }

        function captureAndAnalyze() {
            if (!cameraPreviewCanvas) return; // Asegurarse de que el canvas exista

            setAuditorSpeech('Capturando imagen...');
            const capturedImg = new Image();
            capturedImg.onload = () => {
                // Mostrar la imagen capturada (que ya tiene el enfoque aplicado)
                displayContainer.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.id = 'image-wrapper';
                capturedImg.id = 'uploaded-image';
                const overlay = document.createElement('canvas');
                overlay.id = 'overlay-canvas';
                
                wrapper.appendChild(capturedImg);
                wrapper.appendChild(overlay);
                displayContainer.appendChild(wrapper);

                imageSource = capturedImg;
                isImageReady = true;

                // Detener la cámara después de la captura
                stopCamera();
                
                // Ejecutar el análisis
                runAnalysis();
            };
            capturedImg.src = cameraPreviewCanvas.toDataURL('image/png'); // Captura del canvas con filtro
        }

        async function initializeModel() {
            cameraButton.disabled = true;
            try {
                if (!session) {
                    setAuditorSpeech('Cargando modelo IA (puede tardar)...');
                    session = await ort.InferenceSession.create(MODEL_PATH);
                    isModelReady = true;
                    cameraButton.disabled = false;
                    checkReadyState();
                }
            } catch (error) {
                console.error("Error al cargar el modelo:", error);
                setAuditorSpeech('Error fatal al cargar el modelo.');
            }
        }
        
        async function runAnalysis() {
            if (!isModelReady || !isImageReady || !imageSource) return;

            analyzeButton.disabled = true;
            analyzeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analizando...';
            setAuditorSpeech('Procesando imagen...');

            const { tensor, scale, xOffset, yOffset } = await preprocess(imageSource);
            const results = await session.run({ 'images': tensor });
            
            const overlayCanvas = document.getElementById('overlay-canvas');
            if (!overlayCanvas) return;
            
            const ctx = overlayCanvas.getContext('2d');
            overlayCanvas.width = imageSource.clientWidth;
            overlayCanvas.height = imageSource.clientHeight;

            drawResults(results.output0, ctx, { scale, xOffset, yOffset });
            
            analyzeButton.disabled = false;
            analyzeButton.innerHTML = '<i class="fas fa-search"></i> Analizar de nuevo';
        }

        async function preprocess(source) {
            const canvas = document.createElement('canvas');
            canvas.width = MODEL_WIDTH;
            canvas.height = MODEL_HEIGHT;
            const ctx = canvas.getContext('2d');
            
            const naturalWidth = source.naturalWidth || source.videoWidth; 
            const naturalHeight = source.naturalHeight || source.videoHeight;

            const scale = Math.min(MODEL_WIDTH / naturalWidth, MODEL_HEIGHT / naturalHeight);
            const scaledWidth = naturalWidth * scale;
            const scaledHeight = naturalHeight * scale;
            const xOffset = (MODEL_WIDTH - scaledWidth) / 2;
            const yOffset = (MODEL_HEIGHT - scaledHeight) / 2;
            
            ctx.fillStyle = "#808080";
            ctx.fillRect(0, 0, MODEL_WIDTH, MODEL_HEIGHT);
            ctx.drawImage(source, xOffset, yOffset, scaledWidth, scaledHeight);
            
            const imageData = ctx.getImageData(0, 0, MODEL_WIDTH, MODEL_HEIGHT);
            const float32Data = new Float32Array(3 * MODEL_WIDTH * MODEL_HEIGHT);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const j = i / 4;
                float32Data[j] = imageData.data[i] / 255.0;
                float32Data[j + MODEL_WIDTH * MODEL_HEIGHT] = imageData.data[i + 1] / 255.0;
                float32Data[j + 2 * MODEL_WIDTH * MODEL_HEIGHT] = imageData.data[i + 2] / 255.0;
            }
            const tensor = new ort.Tensor('float32', float32Data, [1, 3, MODEL_HEIGHT, MODEL_WIDTH]);
            return { tensor, scale, xOffset, yOffset };
        }
        
        function drawResults(outputTensor, ctx, preprocInfo) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            const detections = postprocess(outputTensor.data, outputTensor.dims[2]);
            
            detections.forEach(det => {
                const [model_x1, model_y1, model_x2, model_y2] = det.box;
                
                const original_x1 = (model_x1 - preprocInfo.xOffset) / preprocInfo.scale;
                const original_y1 = (model_y1 - preprocInfo.yOffset) / preprocInfo.scale;
                const original_x2 = (model_x2 - preprocInfo.xOffset) / preprocInfo.scale;
                const original_y2 = (model_y2 - preprocInfo.yOffset) / preprocInfo.scale;
                
                const display_x1 = (ctx.canvas.width * original_x1) / imageSource.naturalWidth;
                const display_y1 = (ctx.canvas.height * original_y1) / imageSource.naturalHeight;
                const display_w = ((original_x2 - original_x1) * ctx.canvas.width) / imageSource.naturalWidth;
                const display_h = ((original_y2 - original_y1) * ctx.canvas.height) / imageSource.naturalHeight;

                const color = CLASS_COLORS[det.classId];
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(display_x1, display_y1, display_w, display_h);

                const label = `${det.label} (${(det.score * 100).toFixed(0)}%)`;
                ctx.font = 'bold 16px sans-serif';
                const textMetrics = ctx.measureText(label);
                const textHeight = 16;
                let textY = display_y1 > textHeight + 5 ? display_y1 - 5 : display_y1 + display_h + textHeight + 5;
                if (textY + textHeight > ctx.canvas.height) { textY = display_y1 - 5; }
                
                ctx.fillStyle = color;
                ctx.fillRect(display_x1 - 1, textY - textHeight - 3, textMetrics.width + 6, textHeight + 6);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(label, display_x1 + 2, textY);
            });
            updateSummary(detections);
        }

        function postprocess(outputData, numProposals) {
            const detections = [];
            for (let i = 0; i < numProposals; i++) {
                let maxProb = 0, classId = -1;
                for (let j = 0; j < CLASS_NAMES.length; j++) {
                    const prob = outputData[(4 + j) * numProposals + i];
                    if (prob > maxProb) { maxProb = prob; classId = j; }
                }
                if (maxProb > CONFIDENCE_THRESHOLD) {
                    const x_center = outputData[0 * numProposals + i];
                    const y_center = outputData[1 * numProposals + i];
                    const width = outputData[2 * numProposals + i];
                    const height = outputData[3 * numProposals + i];
                    detections.push({ label: CLASS_NAMES[classId], score: maxProb, classId: classId, box: [x_center - width / 2, y_center - height / 2, x_center + width / 2, y_center + height / 2] });
                }
            }
            detections.sort((a, b) => b.score - a.score);
            const selected = [];
            const active = new Array(detections.length).fill(true);
            for (let i = 0; i < detections.length; i++) {
                if (active[i]) {
                    selected.push(detections[i]);
                    for (let j = i + 1; j < detections.length; j++) {
                        if (active[j] && iou(detections[i].box, detections[j].box) > IOU_THRESHOLD) {
                            active[j] = false;
                        }
                    }
                }
            }
            return selected;
        }

        function iou(boxA, boxB) {
            const x1 = Math.max(boxA[0], boxB[0]); const y1 = Math.max(boxA[1], boxB[1]);
            const x2 = Math.min(boxA[2], boxB[2]); const y2 = Math.min(boxA[3], boxB[3]);
            const interArea = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
            const boxAArea = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
            const boxBArea = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);
            return interArea / (boxAArea + boxBArea - interArea);
        }

        function updateSummary(detections) {
            let conteoClases = {};
            CLASS_NAMES.forEach(nombre => conteoClases[nombre] = 0);
            let muestreoAprobado = true;
            detections.forEach(det => {
                conteoClases[det.label]++;
                if (det.label !== 'Sin Defecto') muestreoAprobado = false;
            });
            if (detections.length === 0) {
                labelContainer.innerHTML = "<p>No se encontraron hallazgos en la muestra.</p>";
                setAuditorSpeech('No encontré hallazgos. ¡Todo bien!'); return;
            }
            let statusMessage = muestreoAprobado ? 'Muestreo Aprobado' : 'Prueba no aprobada';
            let statusColor = muestreoAprobado ? 'green' : 'red';
            let auditorMessage = muestreoAprobado ? '¡Excelente! Todas las piezas están sin defectos.' : 'Se encontraron defectos en la muestra.';
            let summaryHtml = `Resultado: <strong style="color:${statusColor};">${statusMessage}</strong><br>Total de Piezas: <strong>${detections.length}</strong>`;
            summaryHtml += `<table class="results-table"><tr><th>Clase</th><th>Cantidad</th></tr>`;
            for (const clase in conteoClases) {
                if (conteoClases[clase] > 0) {
                    summaryHtml += `<tr><td><span style="color:${CLASS_COLORS[CLASS_NAMES.indexOf(clase)]};">■</span> ${clase}</td><td><strong>${conteoClases[clase]}</strong></td></tr>`;
                }
            }
            summaryHtml += `</table>`;
            setAuditorSpeech(auditorMessage);
            labelContainer.innerHTML = summaryHtml;
        }

        // --- EVENTOS ---
        analyzeButton.addEventListener('click', runAnalysis);
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (isCameraActive) stopCamera();

            isImageReady = false;
            analyzeButton.disabled = true;
            labelContainer.innerHTML = "<p>Cargando imagen...</p>";
            displayContainer.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.id = 'image-wrapper';
            const img = document.createElement('img');
            img.id = 'uploaded-image';
            const overlay = document.createElement('canvas');
            overlay.id = 'overlay-canvas';
            
            wrapper.appendChild(img);
            wrapper.appendChild(overlay);
            displayContainer.appendChild(wrapper);

            img.onload = () => {
                imageSource = img;
                isImageReady = true;
                overlay.width = img.clientWidth;
                overlay.height = img.clientHeight;
                checkReadyState();
            };
            img.src = URL.createObjectURL(file);
        });

        cameraButton.addEventListener('click', () => {
            if (isCameraActive) {
                captureAndAnalyze();
            } else {
                startCamera();
            }
        });

        // NUEVO: Evento para el slider de enfoque
        focusSlider.addEventListener('input', () => {
            if (isCameraActive) {
                // No es necesario llamar a renderCameraFrame directamente aquí,
                // ya que el requestAnimationFrame lo hará continuamente.
                // Simplemente aseguramos que el valor del slider actualice el filtro en el siguiente frame.
                setAuditorSpeech(`Enfoque ajustado a ${focusSlider.value}%.`);
            }
        });
        
        document.addEventListener('DOMContentLoaded', initializeModel);
    </script>
</body>
</html>
