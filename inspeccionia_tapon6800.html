<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección IA v2.0 - Tapon 6800</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        .vision-panel #webcam-container {
            position: relative;
            background-color: #000;
            min-height: 480px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* MEJORA: Estilos para la técnica de superposición */
        #uploaded-image-preview, #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #overlay-canvas {
            pointer-events: none; /* El canvas no interfiere con el mouse */
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .summary-list { list-style-type: none; padding: 0; margin-top: 5px; font-size: 0.9em; }
        #file-input { display: none; }
        .button {
            display: inline-block; padding: 12px 24px; font-size: 1.0em; cursor: pointer;
            text-align: center; text-decoration: none; outline: none; color: #fff;
            background-color: #6c757d; border: none; border-radius: 5px;
            transition: background-color 0.3s;
        }
        .button:hover { background-color: #5a6268; }
        .secondary-action {
            grid-column: 1 / -1; background-color: #e9ecef; color: #495057;
            font-size: 0.9em; padding: 8px 16px;
        }
        .secondary-action:hover { background-color: #ced4da; }
        .results-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .results-table th, .results-table td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        .results-table th { background-color: #f8f9fa; font-weight: bold; }
    </style>
</head>
<body class="inspector-body">
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="imagenes/Logo azor.png" alt="Logo Grupo Azor" class="logo">
                <h1>Inspección de Calidad <span class="ia-badge">IA</span></h1>
            </div>
        </header>
        <main class="main-content-grid"> 
            <section class="vision-panel">
                <h2 class="panel-title"><i class="fas fa-eye"></i> Visor de Inspección</h2>
                <div id="webcam-container">
                    <span style="color:#fff;">Sube una imagen para comenzar</span>
                </div>
                <div class="label-container" id="label-container">
                    <p>Los resultados del análisis aparecerán aquí.</p>
                </div>
                <div class="error-message" id="error-container" style="display: none;"></div>
            </section>
            <aside class="controls-panel">
                <h3 class="panel-title"><i class="fas fa-list-ol"></i> Controles</h3>
                <div class="action-buttons">
                    <button id="analyze-button" class="button primary-action" disabled>
                        <i class="fas fa-search"></i> Analizar
                    </button>
                    <label for="file-input" id="upload-label" class="button">
                        <i class="fas fa-upload"></i> Subir Imagen
                    </label>
                    <input type="file" id="file-input" accept="image/*">
                </div>
                <button id="camera-button" class="button secondary-action"><i class="fas fa-video"></i> Activar Modo Cámara</button>

                <div id="auditor-section"> 
                    <p id="auditor-title">Asistente de Inspección</p>
                    <div id="auditor-image-container">
                        <img id="auditor-image" src="imagenes/Auditor.png" alt="Asistente IA" class="auditor-image-estilizada">
                    </div>
                    <div id="auditor-message-bubble" class="auditor-bubble auditor-bubble-centered"> 
                        <span>Listo para inspeccionar.</span>
                    </div>
                </div>
            </aside>
        </main>
        <footer class="app-footer">&copy; <span id="currentYear"></span> Grupo Azor México.</footer>
    </div>

    <script type="text/javascript">
        // --- CONFIGURACIÓN ---
        const MODELO_ONNX_PATH = "./modelos_ia/tapon_6800/tapon.onnx"; 
        const NOMBRES_CLASES = ['Incompleto', 'Rebaba', 'Sin Defecto', 'Punto Alto'];
        const COLORES_CLASES = ['#FFA500', '#FF4500', '#2E8B57', '#FFD700'];
        const UMBRAL_CONFIANZA = 0.25;
        const UMBRAL_IOU_NMS = 0.45;
        const MODEL_WIDTH = 1280;
        const MODEL_HEIGHT = 1280;

        // --- REFERENCIAS DOM ---
        const analyzeButton = document.getElementById('analyze-button');
        const fileInput = document.getElementById('file-input');
        const webcamContainer = document.getElementById('webcam-container');
        const labelContainer = document.getElementById('label-container');
        const auditorBubbleSpan = document.querySelector('#auditor-message-bubble span');
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // --- VARIABLES DE ESTADO ---
        let onnxSession;
        let currentSource = null; // Puede ser un <img> o <video>
        
        // --- LÓGICA PRINCIPAL ---
        async function initModel() {
            try {
                if (!onnxSession) {
                    setAuditorSpeech('Cargando modelo IA...', 'loading');
                    onnxSession = await ort.InferenceSession.create(MODELO_ONNX_PATH);
                    setAuditorSpeech('Sistema listo. Sube una imagen.', 'idle');
                }
            } catch (error) {
                console.error("Error al cargar el modelo:", error);
                setAuditorSpeech('Error al cargar el modelo.', 'error');
            }
        }
        
        async function analyze() {
            if (!onnxSession || !currentSource) { return; }

            analyzeButton.disabled = true;
            analyzeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analizando...';
            setAuditorSpeech('Procesando...', 'thinking');

            const tensor = await preprocess(currentSource);
            const results = await onnxSession.run({ 'images': tensor });
            
            // MEJORA: Obtenemos el canvas de superposición para dibujar solo los resultados
            const overlayCanvas = document.getElementById('overlay-canvas');
            const ctx = overlayCanvas.getContext('2d');
            
            // Ajustamos el tamaño del canvas al de la imagen mostrada
            overlayCanvas.width = currentSource.clientWidth;
            overlayCanvas.height = currentSource.clientHeight;

            drawBoundingBoxes(results.output0, ctx, currentSource.naturalWidth, currentSource.naturalHeight);
            
            analyzeButton.disabled = false;
            // MEJORA: El botón de subir se reactiva
            analyzeButton.innerHTML = '<i class="fas fa-search"></i> Analizar'; 
        }

        // --- FUNCIONES DE PREPROCESAMIENTO Y MANEJO DE IMAGEN ---
        async function preprocess(source) {
            const canvas = document.createElement('canvas');
            canvas.width = MODEL_WIDTH;
            canvas.height = MODEL_HEIGHT;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(source, 0, 0, MODEL_WIDTH, MODEL_HEIGHT);
            const imageData = ctx.getImageData(0, 0, MODEL_WIDTH, MODEL_HEIGHT);
            
            const float32Data = new Float32Array(3 * MODEL_WIDTH * MODEL_HEIGHT);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const j = i / 4;
                float32Data[j] = imageData.data[i] / 255.0;
                float32Data[j + MODEL_WIDTH * MODEL_HEIGHT] = imageData.data[i + 1] / 255.0;
                float32Data[j + 2 * MODEL_WIDTH * MODEL_HEIGHT] = imageData.data[i + 2] / 255.0;
            }
            return new ort.Tensor('float32', float32Data, [1, 3, MODEL_HEIGHT, MODEL_WIDTH]);
        }
        
        // --- FUNCIONES DE DIBUJO Y POSTPROCESAMIENTO ---
        function drawBoundingBoxes(outputTensor, ctx, originalWidth, originalHeight) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); // Limpiar canvas previo
            const outputData = outputTensor.data;
            const numClasses = NOMBRES_CLASES.length;
            const numProposals = outputTensor.dims[2];

            const detections = [];
            for (let i = 0; i < numProposals; i++) {
                let maxProb = 0; let classId = -1;
                for (let j = 0; j < numClasses; j++) {
                    const prob = outputData[(4 + j) * numProposals + i];
                    if (prob > maxProb) { maxProb = prob; classId = j; }
                }
                if (maxProb > UMBRAL_CONFIANZA) {
                    const x_center = outputData[0 * numProposals + i];
                    const y_center = outputData[1 * numProposals + i];
                    const width = outputData[2 * numProposals + i];
                    const height = outputData[3 * numProposals + i];
                    detections.push({ label: NOMBRES_CLASES[classId], score: maxProb, classId: classId, box: [x_center - width / 2, y_center - height / 2, x_center + width / 2, y_center + height / 2] });
                }
            }
            
            const finalDetections = nonMaxSuppression(detections.map(d=>d.box), detections.map(d=>d.score), UMBRAL_IOU_NMS)
                                      .map(i => detections[i]);

            finalDetections.forEach(det => {
                const [x1, y1, x2, y2] = det.box;
                const x_ratio = ctx.canvas.width / MODEL_WIDTH;
                const y_ratio = ctx.canvas.height / MODEL_HEIGHT;

                const x = x1 * x_ratio;
                const y = y1 * y_ratio;
                const w = (x2 - x1) * x_ratio;
                const h = (y2 - y1) * y_ratio;
                const color = COLORES_CLASES[det.classId];
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);

                const label = `${det.label} (${(det.score * 100).toFixed(0)}%)`;
                ctx.font = 'bold 16px sans-serif';
                const textMetrics = ctx.measureText(label);
                const textHeight = 16;
                const textY = y > textHeight + 5 ? y - 5 : y + h + textHeight + 5;
                ctx.fillStyle = color;
                ctx.fillRect(x - 1, textY - textHeight - 3, textMetrics.width + 6, textHeight + 6);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(label, x + 2, textY);
            });
            updateSummary(finalDetections);
        }

        function updateSummary(detections) {
            // ... (Lógica para crear tabla, sin cambios)
        }
        function nonMaxSuppression(boxes, scores, iouThreshold) { /* ... (sin cambios) ... */ }
        function iou(boxA, boxB) { /* ... (sin cambios) ... */ }
        function setAuditorSpeech(message, status) { /* ... (función simplificada para brevedad) ... */ 
            if(auditorBubbleSpan) auditorBubbleSpan.textContent = message;
        }

        // --- ASIGNACIÓN DE EVENTOS ---
        analyzeButton.addEventListener('click', analyze);
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Limpiar resultados anteriores
            labelContainer.innerHTML = "<p>Imagen cargada. Lista para analizar.</p>";
            webcamContainer.innerHTML = ''; // Limpiar el contenedor

            // Crear y mostrar la imagen
            const img = document.createElement('img');
            img.id = 'uploaded-image-preview';
            
            // Crear el canvas para superposición
            const overlay = document.createElement('canvas');
            overlay.id = 'overlay-canvas';
            
            webcamContainer.appendChild(img);
            webcamContainer.appendChild(overlay);

            img.onload = () => {
                currentSource = img;
                setAuditorSpeech('Imagen lista. Presiona Analizar.', 'idle');
                analyzeButton.disabled = false;
            };
            img.src = URL.createObjectURL(file);
        });

        // Evento para activar la cámara (aún no implementado, es un placeholder)
        cameraButton.addEventListener('click', () => {
            alert("El modo cámara en vivo se implementará en una futura versión.");
            // Aquí iría la lógica de init(true) si se quisiera reactivar
        });
        
        document.addEventListener('DOMContentLoaded', initModel);
    </script>
</body>
</html>
